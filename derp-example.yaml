# If you plan to somehow use headscale, please deploy your own DERP infra.
# See: https://tailscale.com/docs/reference/derp-servers/custom-derp-servers
regions:
  1: null # Disable DERP region with ID 1
  900:
    regionid: 900
    regioncode: custom
    regionname: My Region
    nodes:
      - name: 900a
        regionid: 900
        hostname: myderp.example.com
        ipv4: 198.51.100.1
        ipv6: 2001:db8::1
        stunport: 0
        stunonly: false
        derpport: 0

# Scores scale a region's measured latency when a client picks its home
# DERP: below 1 prefers the region, above 1 avoids it, 1 is neutral. The
# scores of every loaded map are merged, later files win.
homeparams:
  regionscore:
    900: 0.5 # prefer the custom region unless it is twice as slow
