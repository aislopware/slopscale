noise:
  private_key_path: "private_key.pem"

prefixes:
  v6: fd7a:115c:a1e0::/48
  v4: 100.64.0.0/10

database:
  type: sqlite3

server_url: "https://server.derp.no"

dns:
  magic_dns: true
  base_domain: example.com

  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 8.8.8.8
    split:
      corp.example:
        - 10.0.0.1
        - 10.0.0.2
      lab.example:
        - 10.0.0.3
    use_with_exit_node:
      global:
        - 1.1.1.1
      split:
        corp.example:
          - 10.0.0.1
          - 10.0.0.2
