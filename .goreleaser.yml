---
version: 2
before:
  hooks:
    - go mod tidy
    - go mod vendor
    # Embed the admin console (web/embed.go) into every binary and image.
    - make web

release:
  prerelease: auto
  draft: true
  header: |
    ## Upgrade

    Please follow the steps outlined in the [upgrade guide](https://aislopware.github.io/slopscale/stable/setup/upgrade/) to update your existing Slopscale installation.

# The SQLite driver is C compiled by cgo, so every target needs a C
# compiler: zigcc (from the Nix devShell, which also exports CGO_CFLAGS from
# sqlite.cflags) maps GOOS/GOARCH to a zig target and links statically
# against musl. Only Linux targets are cross-compiled; macOS and FreeBSD
# users build natively or through the Nix flake.
builds:
  - id: slopscale
    main: ./cmd/slopscale
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=1
      - CC=zigcc
    targets:
      - linux_amd64
      - linux_arm64
      - linux_arm_7
    flags:
      - -mod=readonly
      - -trimpath
      - -tags=netgo,osusergo
    ldflags:
      - -s -w -X main.version={{ .Version }}
      - -linkmode=external
      - -extldflags=-static

archives:
  - id: golang-cross
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    formats:
      - binary

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}"
  format: tar.gz
  files:
    - "vendor/"

nfpms:
  # Configure nFPM for .deb releases
  #
  # See https://goreleaser.com/customization/package/nfpm/
  #
  # Useful tools for debugging .debs:
  # List file contents: dpkg -c dist/slopscale...deb
  # Package metadata: dpkg --info dist/slopscale....deb
  #
  - ids:
      - slopscale
    package_name: slopscale
    priority: optional
    vendor: slopscale
    maintainer: Kristoffer Dalby <kristoffer@dalby.cc>
    homepage: https://github.com/aislopware/slopscale
    description: |-
      Open source implementation of the Tailscale control server.
      Slopscale aims to implement a self-hosted, open source alternative to the
      Tailscale control server. Slopscale's goal is to provide self-hosters and
      hobbyists with an open-source server they can use for their projects and
      labs. It implements a narrow scope, a single Tailscale network (tailnet),
      suitable for a personal use, or a small open-source organisation.
    bindir: /usr/bin
    section: net
    formats:
      - deb
    contents:
      - src: ./config-example.yaml
        dst: /etc/slopscale/config.yaml
        type: config|noreplace
        file_info:
          mode: 0644
      - src: ./packaging/systemd/slopscale.service
        dst: /usr/lib/systemd/system/slopscale.service
      - dst: /var/lib/slopscale
        type: dir
      - src: ./config-example.yaml
        dst: /usr/share/doc/slopscale/examples/config-example.yaml
      - src: LICENSE
        dst: /usr/share/doc/slopscale/copyright
    scripts:
      postinstall: ./packaging/deb/postinst
      postremove: ./packaging/deb/postrm
      preremove: ./packaging/deb/prerm
    deb:
      lintian_overrides:
        - no-changelog # Our CHANGELOG.md uses a different formatting
        - no-manual-page
        - statically-linked-binary

kos:
  - id: ghcr
    repositories:
      - ghcr.io/aislopware/slopscale

    # bare tells KO to only use the repository
    # for tagging and naming the container.
    bare: true
    base_image: gcr.io/distroless/base-debian13
    labels:
      org.opencontainers.image.source: https://github.com/aislopware/slopscale
    annotations:
      org.opencontainers.image.source: https://github.com/aislopware/slopscale
    build: slopscale
    main: ./cmd/slopscale
    env:
      - CGO_ENABLED=1
      - CC=zigcc
    flags:
      - -trimpath
      - -tags=netgo,osusergo
    ldflags:
      - -s -w
      - -linkmode=external
      - -extldflags=-static
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ if not .Prerelease }}latest{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}stable{{ else }}unstable{{ end }}"
      - "{{ .Tag }}"
      - '{{ trimprefix .Tag "v" }}'
      - "sha-{{ .ShortCommit }}"
    creation_time: "{{.CommitTimestamp}}"
    ko_data_creation_time: "{{.CommitTimestamp}}"

  - id: ghcr-debug
    repositories:
      - ghcr.io/aislopware/slopscale

    bare: true
    base_image: gcr.io/distroless/base-debian13:debug
    labels:
      org.opencontainers.image.source: https://github.com/aislopware/slopscale
    annotations:
      org.opencontainers.image.source: https://github.com/aislopware/slopscale
    build: slopscale
    main: ./cmd/slopscale
    env:
      - CGO_ENABLED=1
      - CC=zigcc
    flags:
      - -trimpath
      - -tags=netgo,osusergo
    ldflags:
      - -s -w
      - -linkmode=external
      - -extldflags=-static
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ if not .Prerelease }}latest-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}.{{ .Patch }}-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}-debug{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}.{{ .Patch }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}-debug{{ end }}"
      - "{{ if not .Prerelease }}v{{ .Major }}-debug{{ end }}"
      - "{{ if not .Prerelease }}stable-debug{{ else }}unstable-debug{{ end }}"
      - "{{ .Tag }}-debug"
      - '{{ trimprefix .Tag "v" }}-debug'
      - "sha-{{ .ShortCommit }}-debug"

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
