---
# slopscale will look for a configuration file named `config.yaml` (or `config.json`) in the following order:
#
# - `/etc/slopscale`
# - `~/.slopscale`
# - current working directory

# The url clients will connect to.
# Typically this will be a domain like:
#
# https://myslopscale.example.com:443
#
server_url: http://127.0.0.1:8080

# Address to listen to / bind to on the server
#
# For production:
# listen_addr: 0.0.0.0:8080
listen_addr: 127.0.0.1:8080

# Address to listen to /metrics and /debug, you may want
# to keep this endpoint private to your internal network
# Use an empty value to disable the metrics listener.
metrics_listen_addr: 127.0.0.1:9090

# CIDR(s) of reverse proxies (e.g. 127.0.0.1/32) whose
# True-Client-IP, X-Real-IP and X-Forwarded-For headers should
# be honoured. Empty (default) ignores those headers; setting
# this without a proxy in front lets clients spoof their logged
# source IP.
trusted_proxies: []

# The Noise section includes specific configuration for the
# TS2021 Noise protocol
noise:
  # The Noise private key is used to encrypt the traffic between slopscale and
  # Tailscale clients when using the new Noise-based protocol. A missing key
  # will be automatically generated.
  private_key_path: /var/lib/slopscale/noise_private.key

# List of IP prefixes to allocate tailaddresses from.
# Each prefix consists of either an IPv4 or IPv6 address,
# and the associated prefix length, delimited by a slash.
#
# WARNING: These prefixes MUST be subsets of the standard Tailscale ranges:
#   - IPv4: 100.64.0.0/10 (CGNAT range)
#   - IPv6: fd7a:115c:a1e0::/48 (Tailscale ULA range)
#
# Using a SUBSET of these ranges is supported and useful if you want to
# limit IP allocation to a smaller block (e.g., 100.64.0.0/24).
#
# Using ranges OUTSIDE of CGNAT/ULA is NOT supported and will cause
# undefined behaviour. The Tailscale client has hard-coded assumptions
# about these ranges and will break in subtle, hard-to-debug ways.
#
# See:
# IPv4: https://github.com/tailscale/tailscale/blob/22ebb25e833264f58d7c3f534a8b166894a89536/net/tsaddr/tsaddr.go#L33
# IPv6: https://github.com/tailscale/tailscale/blob/22ebb25e833264f58d7c3f534a8b166894a89536/net/tsaddr/tsaddr.go#LL81C52-L81C71
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

  # Strategy used for allocation of IPs to nodes, available options:
  # - sequential (default): assigns the next free IP from the previous given
  #   IP. A best-effort approach is used and Slopscale might leave holes in the
  #   IP range or fill up existing holes in the IP range.
  # - random: assigns the next free IP from a pseudo-random IP generator (crypto/rand).
  allocation: sequential

# DERP is a relay system that Tailscale uses when a direct
# connection cannot be established.
# https://tailscale.com/blog/how-tailscale-works/#encrypted-tcp-relays-derp
#
# Slopscale needs a list of DERP servers that can be presented to the clients.
# DERP relays carry traffic between machines that cannot connect directly
# and help them find each other (STUN). Everything below except `paths`,
# `private_key_path` and `automatically_add_embedded_derp_region` can also
# be changed while the server runs, from the admin console's Relays page,
# `slopscale derp set` or PUT /api/v1/derp; settings set that way are stored
# in the database and replace this section until `slopscale derp reset`.
derp:
  server:
    # Runs the embedded DERP relay on the server_url and publishes it to
    # every machine next to the relays from `urls` and `paths`, so there
    # is always a relay near the control server. On by default. The
    # server_url should use https: with http the relay is published as
    # insecure and clients reach it in plain HTTP.
    enabled: true

    # Region ID to use for the embedded DERP server.
    # The local DERP prevails if the region ID collides with other region ID coming from
    # the regular DERP config.
    region_id: 999

    # Region code and name are displayed in the Tailscale UI to identify a DERP region
    region_code: "slopscale"
    region_name: "Slopscale Embedded DERP"

    # Only allow clients associated with this server access
    verify_clients: true

    # Answer STUN on stun_listen_addr and publish the port in the DERP map,
    # so machines learn their public address from the relay. Turn it off
    # when the relay sits on the machines' own network and they reach its
    # public address through their router: the replies then name the
    # router instead of the public address, disagree with Tailscale's
    # STUN servers, and every machine there reports a hard NAT.
    # Tailscale's relays still answer STUN for them.
    stun_enabled: true

    # Listens over UDP at the configured address for STUN connections - to help with NAT traversal.
    # Required while the embedded DERP server is enabled with STUN.
    #
    # For more details on how this works, check this great article: https://tailscale.com/blog/how-tailscale-works/
    stun_listen_addr: "0.0.0.0:3478"

    # Private key used to encrypt the traffic between slopscale DERP and
    # Tailscale clients. A missing key will be automatically generated.
    # Defaults to derp_server_private.key next to the noise private key.
    private_key_path: /var/lib/slopscale/derp_server_private.key

    # This flag can be used, so the DERP map entry for the embedded DERP server is not written automatically,
    # it enables the creation of your very own DERP map entry using a locally available file with the parameter DERP.paths
    # If you enable the DERP server and set this to false, it is required to add the DERP server to the DERP map using DERP.paths
    automatically_add_embedded_derp_region: true

    # For better connection stability (especially when using an Exit-Node and DNS is not working),
    # it is possible to optionally add the public IPv4 and IPv6 address to the Derp-Map using:
    # ipv4: 198.51.100.1
    # ipv6: 2001:db8::1

  # List of externally available DERP maps encoded in JSON. The default is
  # Tailscale's public relays, which are merged with the embedded relay;
  # machines pick the closest one by latency. Set to [] to serve only your
  # own relays.
  urls:
    - https://controlplane.tailscale.com/derpmap/default

  # Locally available DERP map files encoded in YAML
  #
  # This option is mostly interesting for people hosting their own DERP servers:
  # https://tailscale.com/docs/reference/derp-servers/custom-derp-servers
  # https://aislopware.github.io/slopscale/ref/derp/
  #
  # Relays you run can also be added at runtime from the console, so a
  # file is only needed for what the console cannot express (region
  # scores, removing one of Tailscale's regions).
  #
  # paths:
  #   - /etc/slopscale/derp-example.yaml
  paths: []

  # If enabled, a worker will be set up to periodically
  # refresh the given sources and update the derpmap
  # will be set up.
  auto_update_enabled: true

  # How often should we check for DERP updates?
  update_frequency: 3h

# Disables the automatic check for slopscale updates on startup
disable_check_updates: false

# Node lifecycle configuration.
node:
  # Default key expiry for non-tagged nodes, regardless of registration method
  # (auth key, CLI, web auth). Tagged nodes are exempt and never expire.
  #
  # This is the base default. OIDC can override this via oidc.expiry.
  # If a client explicitly requests a specific expiry, the client value is used.
  #
  # Setting the value to "0" means no default expiry (nodes never expire unless
  # explicitly expired via `slopscale nodes expire`).
  #
  # Tailscale SaaS uses 180d; set to a positive duration to match that behaviour.
  #
  # Default: 0 (no default expiry)
  expiry: 0

  ephemeral:
    # Time before an inactive ephemeral node is deleted.
    inactivity_timeout: 30m

  # HA subnet router health probing.
  #
  # When HA routes exist (2+ nodes advertising the same prefix), slopscale
  # pings each HA node every probe_interval via the Noise channel. If a node
  # fails to respond within probe_timeout it is marked unhealthy and the
  # primary role moves to the next healthy node. A node that later responds
  # is marked healthy again but does NOT reclaim primary (avoids flapping).
  #
  # Worst-case detection time is probe_interval + probe_timeout (15s default).
  # No-op when no HA routes exist. Set probe_interval to 0 to disable.
  routes:
    ha:
      # How often to ping HA subnet routers. Set to 0 to disable probing.
      # Must be >= 2s when enabled.
      probe_interval: 10s

      # How long to wait for a ping response before marking a node unhealthy.
      # Must be >= 1s and less than probe_interval.
      probe_timeout: 5s

database:
  # Database type. Available options: sqlite, postgres
  # Please note that using Postgres is highly discouraged as it is only supported for legacy reasons.
  # All new development, testing and optimisations are done with SQLite in mind.
  type: sqlite

  # Enable debug mode. This setting requires the log.level to be set to "debug" or "trace".
  debug: false

  # SQL query log, written at debug level when database.debug is enabled.
  # The former `gorm` block is still read but deprecated.
  query_log:
    # Log placeholders instead of the bound query arguments.
    parameterized: true

    # Log queries that returned no rows as errors.
    log_not_found: false

    # Threshold for slow queries in milliseconds.
    slow_threshold: 1000

  # SQLite config
  sqlite:
    path: /var/lib/slopscale/db.sqlite

    # Enable WAL mode for SQLite. This is recommended for production environments.
    # https://www.sqlite.org/wal.html
    write_ahead_log: true

    # Maximum number of WAL file frames before the WAL file is automatically checkpointed.
    # https://www.sqlite.org/c3ref/wal_autocheckpoint.html
    # Set to 0 to disable automatic checkpointing.
    wal_autocheckpoint: 1000

  # # Postgres config
  # Please note that using Postgres is highly discouraged as it is only supported for legacy reasons.
  # See database.type for more information.
  # postgres:
  #   # If using a Unix socket to connect to Postgres, set the socket path in the 'host' field and leave 'port' blank.
  #   host: localhost
  #   port: 5432
  #   name: slopscale
  #   user: foo
  #   pass: bar
  #   max_open_conns: 10
  #   max_idle_conns: 10
  #   conn_max_idle_time_secs: 3600

  #   # If other 'sslmode' is required instead of 'require(true)' and 'disabled(false)', set the 'sslmode' you need
  #   # in the 'ssl' field. Refers to https://www.postgresql.org/docs/current/libpq-ssl.html Table 34.1.
  #   ssl: false

### TLS configuration
# See: https://aislopware.github.io/slopscale/ref/tls/

## Let's Encrypt / ACME
# Slopscale supports automatically requesting and setting up
# TLS for a domain with Let's Encrypt.

# URL to ACME directory
acme_url: https://acme-v02.api.letsencrypt.org/directory

# Email to register with ACME provider
acme_email: ""

# Domain name to request a TLS certificate for:
tls_letsencrypt_hostname: ""

# Path to store certificates and metadata needed by letsencrypt
tls_letsencrypt_cache_dir: /var/lib/slopscale/cache

# Type of ACME challenge to use, currently supported types:
# HTTP-01 or TLS-ALPN-01
tls_letsencrypt_challenge_type: HTTP-01

# When HTTP-01 challenge is chosen, letsencrypt must set up a
# verification endpoint, and it will be listening on:
# :http = port 80
tls_letsencrypt_listen: ":http"

## Use already defined certificates:
tls_cert_path: ""
tls_key_path: ""

log:
  # Valid log levels: panic, fatal, error, warn, info, debug, trace
  level: info

  # Output formatting for logs: text or json
  format: text

## Policy
# Slopscale supports a wide range of Tailscale policy features such as ACLs and
# Grants. Please have a look at their docs to better understand the concepts:
# ACLs: https://tailscale.com/docs/features/access-control/acls
# Grants: https://tailscale.com/docs/features/access-control/grants
policy:
  # The mode can be "file" or "database" that defines
  # where the policies are stored and read from.
  mode: file

  # If the mode is set to "file", the path to a HuJSON file containing policies.
  path: ""

  # Path of a MaxMind country database (GeoLite2-Country.mmdb or
  # GeoIP2-Country.mmdb). When set, postures can check ip:country, the
  # country of the address a node connects to the control server from.
  # geoip_database: /var/lib/slopscale/GeoLite2-Country.mmdb

## Notifications
#
# Email webhooks (provider "email", URL "mailto:...") send through this
# server; see https://aislopware.github.io/slopscale/ref/webhooks/#notifications.
# Leave host unset to refuse email endpoints.
# notifications:
#   smtp:
#     host: smtp.example.com
#     port: 587
#     username: slopscale
#     password: ""
#     from: "Slopscale <slopscale@example.com>"
#     # starttls (default), tls for an implicit-TLS port such as 465, or
#     # none for a relay on localhost.
#     encryption: starttls

## HTTPS certificates
#
# Let machines get Let's Encrypt certificates for their MagicDNS names
# with `tailscale cert`. The base domain must be a real zone the server
# can publish TXT records in; see
# https://aislopware.github.io/slopscale/ref/https-certificates/.
# https_certificates:
#   enabled: false
#   # cloudflare, rfc2136 or command.
#   provider: cloudflare
#   ttl: 1m
#   cloudflare:
#     # Needs Zone:Read and DNS:Edit on the zone.
#     api_token: ""
#     # Empty finds the zone from the record's name.
#     zone_id: ""
#   rfc2136:
#     server: 127.0.0.1:53
#     # Empty uses dns.base_domain.
#     zone: ""
#     tsig_key_name: ""
#     tsig_secret: ""
#     tsig_algorithm: hmac-sha256
#   command:
#     # Run with the record name and value as its two arguments.
#     path: /usr/local/bin/publish-txt

## SSH session recording
#
# Run a session recorder inside the server. It joins the tailnet as
# `slopscale-recorder` (tag:slopscale-recorder) and records every session
# that Tailscale SSH admits, unless a rule names another recorder; see
# https://aislopware.github.io/slopscale/ref/ssh-recording/.
# ssh_recording:
#   enabled: false
#   # One asciinema file per session.
#   dir: /var/lib/slopscale/recordings
#   # The recorder node's keys.
#   state_dir: /var/lib/slopscale/recorder
#   # Delete recordings older than this; unset keeps them.
#   retention: 2160h
#   # Refuse to store more than this from one session; what arrived is kept
#   # and marked incomplete. 0 uses the default of 512 MiB, not unlimited.
#   max_session_bytes: 536870912

## Funnel
#
# Run a Funnel ingress inside the server: it joins the tailnet as
# `slopscale-ingress` (tag:slopscale-ingress) and delivers public TLS
# connections to the machine named by the server name, for machines the
# policy grants the `funnel` node attribute. Needs HTTPS certificates and
# public DNS pointing the machines' names at this server; see
# https://aislopware.github.io/slopscale/ref/funnel/.
# funnel:
#   enabled: false
#   # The public addresses to accept TLS on, one per Funnel port. Change
#   # them when the server itself listens on 443.
#   listen_addrs: [":443", ":8443", ":10000"]
#   # The ingress node's keys.
#   state_dir: /var/lib/slopscale/ingress
#   # The ports `tailscale funnel` may be turned on for.
#   ports: [443, 8443, 10000]

## Client updates
#
# Tell clients whether a newer Tailscale client exists, the way the hosted
# control plane does: the server reads the latest stable release from
# https://pkgs.tailscale.com once a day and each client behind it shows
# the "update available" health warning (and updates itself when its
# auto-update is on). The Server page of the console shows the release.
# client_updates:
#   # Set to false on a server without internet access, or to keep the
#   # clients quiet.
#   check: true
#   # How often to look; at least 1h.
#   interval: 24h

## Control dial plan
#
# Addresses clients try for this server before resolving server_url's
# host name, in order of preference. Clients keep the plan between runs,
# so they reach the server when DNS is down, and fall back to the name
# when none of the addresses answers. Leave empty to rely on DNS.
# control_dial_plan:
#   - 203.0.113.7
#   - 2001:db8::7

## Outbound requests
#
# Where slopscale's own HTTP clients may go: webhook receivers, log stream
# sinks and DERP map URLs. Loopback, link-local (169.254.0.0/16, fe80::/10)
# and unspecified addresses are always refused, so an operator-supplied URL
# cannot reach the server's own services or a cloud metadata endpoint. Both
# the URL and the address it resolves to are checked.
# egress:
#   # Refuse the private ranges too (10/8, 172.16/12, 192.168/16, fc00::/7
#   # and the tailnet's 100.64/10). Off by default: receivers on the LAN are
#   # a normal self-hosted setup.
#   deny_private_targets: false
#   # Re-allow loopback, for a development server whose receivers run
#   # alongside it. Do not set this in production.
#   allow_loopback_targets: false

## Development endpoints
#
# Off by default and not part of the supported API.
# debug:
#   # Serve POST /api/v1/debug/node, which mints a node from key material
#   # the caller supplies (`slopscale debug create-node`). Development only:
#   # while it is off the operation is not registered and is absent from the
#   # OpenAPI document the server serves.
#   node_api_enabled: false

## DNS
#
# slopscale supports Tailscale's DNS configuration and MagicDNS.
# Please have a look to their docs to better understand the concepts:
#
# - https://tailscale.com/docs/features/magicdns
# - https://tailscale.com/blog/2021-09-private-dns-with-magicdns
#
# Please note that for the DNS configuration to have any effect,
# clients must have the `--accept-dns=true` option enabled. This is the
# default for the Tailscale client. This option is enabled by default
# in the Tailscale client.
#
# Setting _any_ of the configuration and `--accept-dns=true` on the
# clients will integrate with the DNS manager on the client or
# overwrite /etc/resolv.conf.
# https://tailscale.com/docs/reference/faq/dns-resolv-conf
#
# If you want stop Slopscale from managing the DNS configuration
# all the fields under `dns` should be set to empty values.
dns:
  # Whether to use MagicDNS
  magic_dns: true

  # Defines the base domain to create the hostnames for MagicDNS.
  # This domain _must_ be different from the server_url domain.
  # `base_domain` must be a FQDN, without the trailing dot.
  # The FQDN of the hosts will be
  # `hostname.base_domain` (e.g., _myhost.example.com_).
  base_domain: example.com

  # Whether to use the local DNS settings of a node or override the local DNS
  # settings (default) and force the use of Slopscale's DNS configuration.
  override_local_dns: true

  # List of DNS servers to expose to clients.
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
      - 2606:4700:4700::1111
      - 2606:4700:4700::1001

      # NextDNS (see https://tailscale.com/docs/integrations/nextdns).
      # "abc123" is example NextDNS ID, replace with yours.
      # - https://dns.nextdns.io/abc123

    # Split DNS (see https://tailscale.com/docs/reference/dns-in-tailscale#restricted-nameservers),
    # a map of domains and which DNS server to use for each.
    split: {}
      # foo.bar.com:
      #   - 1.1.1.1
      # darp.slopscale.net:
      #   - 1.1.1.1
      #   - 8.8.8.8

    # Nameservers a machine keeps using while it has an exit node selected
    # (Tailscale's per-nameserver "Use with exit node"); the rest of its
    # DNS goes through the exit node. `global` lists entries of
    # `nameservers.global` and needs `override_local_dns: true`, as the
    # client only honours the flag on resolvers it uses for every query.
    # `split` lists, per domain, entries of `nameservers.split`; a domain
    # survives the exit node only when every one of its nameservers is
    # listed. Needs Tailscale 1.88.1 or later on the client.
    use_with_exit_node:
      global: []
      # - 1.1.1.1
      split: {}
      # darp.slopscale.net:
      #   - 1.1.1.1
      #   - 8.8.8.8

  # Set custom DNS search domains. With MagicDNS enabled,
  # your tailnet base_domain is always the first search domain.
  search_domains: []

  # Extra DNS records
  # so far only A and AAAA records are supported (on the tailscale side)
  # See: https://aislopware.github.io/slopscale/ref/dns/
  extra_records: []
  #   - name: "grafana.myvpn.example.com"
  #     type: "A"
  #     value: "100.64.0.3"
  #
  #   # you can also put it in one line
  #   - { name: "prometheus.myvpn.example.com", type: "A", value: "100.64.0.3" }
  #
  # Alternatively, extra DNS records can be loaded from a JSON file.
  # Slopscale processes this file on each change.
  # extra_records_path: /var/lib/slopscale/extra-records.json

# Unix socket used for the CLI to connect without authentication
# Note: for production you will want to set this to something like:
unix_socket: /var/run/slopscale/slopscale.sock
unix_socket_permission: "0770"

# OpenID Connect
# https://aislopware.github.io/slopscale/ref/oidc/
# oidc:
#   # Block startup until the identity provider is available and healthy.
#   only_start_if_oidc_is_available: true
#
#   # OpenID Connect Issuer URL from the identity provider
#   issuer: "https://your-oidc.issuer.com/path"
#
#   # Client ID from the identity provider. Like every key here it may
#   # come from the environment instead: SLOPSCALE_OIDC_CLIENT_ID.
#   client_id: "your-oidc-client-id"
#
#   # Client secret generated by the identity provider, or
#   # SLOPSCALE_OIDC_CLIENT_SECRET in the environment.
#   # Note: client_secret and client_secret_path are mutually exclusive.
#   client_secret: "your-oidc-client-secret"
#   # Alternatively, set `client_secret_path` to read the secret from the file.
#   # It resolves environment variables, making integration to systemd's
#   # `LoadCredential` straightforward:
#   client_secret_path: "${CREDENTIALS_DIRECTORY}/oidc_client_secret"
#
#   # Use the expiry from the token received from OpenID when the user logged
#   # in. This will typically lead to frequent need to reauthenticate and should
#   # only be enabled if you know what you are doing.
#   # Note: enabling this will cause `node.expiry` to be ignored for
#   # OIDC-authenticated nodes.
#   use_expiry_from_token: false
#
#   # The OIDC scopes to use, defaults to "openid", "profile" and "email".
#   # Custom scopes can be configured as needed, be sure to always include the
#   # required "openid" scope.
#   scope: ["openid", "profile", "email"]
#
#   # Only verified email addresses are synchronized to the user profile by
#   # default. Unverified emails may be allowed in case an identity provider
#   # does not send the "email_verified: true" claim or email verification is
#   # not required.
#   email_verified_required: true
#
#   # Match a login whose provider identifier is unknown to the existing OIDC
#   # user with the same email and move the user to the new identifier. Turn
#   # this on while switching identity providers and off again afterwards.
#   # match_by_email: false
#
#   # Provide custom key/value pairs which get sent to the identity provider's
#   # authorization endpoint.
#   extra_params:
#     domain_hint: example.com
#
#   # Only accept users whose email domain is part of the allowed_domains list.
#   allowed_domains:
#     - example.com
#
#   # Only accept users whose email address is part of the allowed_users list.
#   allowed_users:
#     - alice@example.com
#
#   # Only accept users which are members of at least one group in the
#   # allowed_groups list.
#   allowed_groups:
#     - /slopscale
#
#   # Users whose email address is listed here are made admins when they
#   # sign in, so the admin console can be administered without granting
#   # roles over the CLI first. The list only promotes members; the owner
#   # and users who already hold a role keep it, and removing an address
#   # does not demote anyone.
#   admin_users:
#     - alice@example.com
#
#   # Mirror the groups claim into slopscale groups on every sign-in: each
#   # claimed group becomes a group of the same name with the user in it,
#   # and the user leaves the synced groups the claim no longer lists. A
#   # prefix limits the sync to the claims that carry it and is stripped
#   # from the name. Operator-made groups are never taken over by name.
#   groups:
#     sync: false
#     prefix: ""
#
#   # Optional: PKCE (Proof Key for Code Exchange) configuration
#   # PKCE adds an additional layer of security to the OAuth 2.0 authorization code flow
#   # by preventing authorization code interception attacks
#   # See https://datatracker.ietf.org/doc/html/rfc7636
#   pkce:
#     # Enable or disable PKCE support (default: false)
#     enabled: false
#
#     # PKCE method to use:
#     # - plain: Use plain code verifier
#     # - S256: Use SHA256 hashed code verifier (default, recommended)
#     method: S256

# Audit log
# https://aislopware.github.io/slopscale/ref/audit/
# Every writing API request is recorded with its caller and outcome.
audit:
  # How long events are kept; the collector runs hourly. "0" keeps them
  # forever.
  retention: "0"

# Logtail configuration
# Logtail is Tailscales logging and auditing infrastructure, it allows the
# control panel to instruct tailscale nodes to log their activity to a remote
# server. To disable logging on the client side, please refer to:
# https://tailscale.com/docs/features/logging#opt-out-of-client-logging
logtail:
  # Enable logtail for tailscale nodes of this Slopscale instance.
  # As there is currently no support for overriding the log server in Slopscale, this is
  # disabled by default. Enabling this will make your clients send logs to Tailscale Inc.
  enabled: false

# Taildrop configuration
# Taildrop is the file sharing feature of Tailscale, allowing nodes to
# send files to each other.
# https://tailscale.com/docs/features/taildrop
taildrop:
  # Enable or disable Taildrop tailnet-wide. When disabled, slopscale
  # withholds `https://tailscale.com/cap/file-sharing` from every
  # node's CapMap.
  enabled: true

# Default node auto-update behaviour. When enabled, every node's
# CapMap carries `default-auto-update: [true]` so clients that have
# not made a local opt-in / opt-out choice run auto-updates by
# default. Setting it back to false flips the default for future
# clients; clients that already stored the value locally keep their
# choice.
auto_update:
  enabled: false

# Advanced performance tuning parameters.
# The defaults are carefully chosen and should rarely need adjustment.
# Only modify these if you have identified a specific performance issue.
#
# tuning:
#   # Maximum number of pending registration entries in the auth cache.
#   # Oldest entries are evicted when the cap is reached.
#   #
#   # register_cache_max_entries: 1024
#
#   # NodeStore write batching configuration.
#   # The NodeStore batches write operations before rebuilding peer relationships,
#   # which is computationally expensive. Batching reduces rebuild frequency.
#   #
#   # node_store_batch_size: 100
#   # node_store_batch_timeout: 500ms
