components:
  schemas:
    AccessDecisionBody:
      additionalProperties: false
      properties:
        durationSeconds:
          format: int64
          type: integer
        note:
          type: string
      type: object
    AccessRequest:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        decidedAt:
          format: date-time
          type:
            - string
            - "null"
        decidedBy:
          type: string
        durationSeconds:
          format: int64
          type: integer
        expiresAt:
          format: date-time
          type:
            - string
            - "null"
        groupId:
          format: uint64
          type: string
        id:
          format: uint64
          type: string
        nodeId:
          format: uint64
          type: string
        note:
          description: What the approver said.
          type: string
        reason:
          type: string
        status:
          description: One of pending, approved, denied, cancelled.
          type: string
        userId:
          format: uint64
          type: string
      required:
        - id
        - userId
        - groupId
        - reason
        - durationSeconds
        - status
        - decidedBy
        - note
        - createdAt
        - decidedAt
        - expiresAt
      type: object
    AccessRequestBody:
      additionalProperties: false
      properties:
        durationSeconds:
          description: Between 300 (five minutes) and 2592000 (thirty days).
          format: int64
          type: integer
        groupId:
          format: uint64
          type: string
        nodeId:
          format: uint64
          type: string
        reason:
          type: string
      required:
        - groupId
        - durationSeconds
      type: object
    AccessRequestOption:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          format: uint64
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    AccessRule:
      additionalProperties: false
      properties:
        bidirectional:
          type: boolean
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        destinationGroupIds:
          items:
            type: string
          type: array
        enabled:
          type: boolean
        expiresAt:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uint64
          type: string
        name:
          type: string
        ports:
          description: Comma-separated ports and ranges, empty for every port.
          type: string
        postureIds:
          items:
            type: string
          type: array
        protocol:
          description: One of all, tcp, udp, icmp.
          type: string
        sourceGroupIds:
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - enabled
        - protocol
        - ports
        - bidirectional
        - sourceGroupIds
        - destinationGroupIds
        - postureIds
        - expiresAt
        - createdAt
        - updatedAt
      type: object
    AccessRuleRequestBody:
      additionalProperties: false
      properties:
        bidirectional:
          type: boolean
        description:
          type: string
        destinationGroupIds:
          items:
            type: string
          type:
            - array
            - "null"
        enabled:
          description: Defaults to true.
          type: boolean
        expiresAt:
          format: date-time
          type: string
        name:
          type: string
        ports:
          type: string
        postureIds:
          description: Postures a source must satisfy, any one of them.
          items:
            type: string
          type:
            - array
            - "null"
        protocol:
          description: One of all, tcp, udp, icmp.
          type: string
        sourceGroupIds:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - protocol
        - sourceGroupIds
        - destinationGroupIds
      type: object
    ApiKey:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type:
            - string
            - "null"
        expiration:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uint64
          type: string
        lastSeen:
          format: date-time
          type:
            - string
            - "null"
        prefix:
          type: string
        userId:
          description: Owning user id; null for a legacy key.
          format: uint64
          type:
            - string
            - "null"
      required:
        - id
        - prefix
        - expiration
        - createdAt
        - lastSeen
        - userId
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        action:
          description: "What happened, dotted and object first: user.role.set, node.delete."
          type: string
        actorKind:
          description: local, api_key, oauth, session or system.
          type: string
        actorName:
          description: The actor's user name, or the credential's prefix.
          type: string
        actorUserId:
          description: The user behind the actor; empty for a credential without one.
          type: string
        createdAt:
          format: date-time
          type: string
        detail:
          additionalProperties: {}
          description: Action-specific fields.
          type: object
        id:
          format: uint64
          type: string
        outcome:
          description: The HTTP status the request ended with.
          format: int64
          type: integer
        remoteAddr:
          type: string
        targetId:
          type: string
        targetKind:
          type: string
        targetName:
          type: string
      required:
        - id
        - createdAt
        - actorKind
        - actorUserId
        - actorName
        - action
        - targetKind
        - targetId
        - targetName
        - outcome
        - detail
        - remoteAddr
      type: object
    AuthApproveOutputBody:
      additionalProperties: false
      type: object
    AuthApproveRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
      type: object
    AuthRegisterOutputBody:
      additionalProperties: false
      properties:
        node:
          $ref: "#/components/schemas/Node"
      required:
        - node
      type: object
    AuthRegisterRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
        user:
          type: string
      type: object
    AuthRejectOutputBody:
      additionalProperties: false
      type: object
    AuthRejectRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
      type: object
    BackfillNodeIPsOutputBody:
      additionalProperties: false
      properties:
        changes:
          items:
            type: string
          type: array
      required:
        - changes
      type: object
    CheckPolicyOutputBody:
      additionalProperties: false
      type: object
    ConsoleAuth:
      additionalProperties: false
      properties:
        oidc:
          $ref: "#/components/schemas/ConsoleOIDC"
      type: object
    ConsoleOIDC:
      additionalProperties: false
      properties:
        loginPath:
          type: string
        provider:
          type: string
      required:
        - provider
        - loginPath
      type: object
    CreateAPIKeyOutputBody:
      additionalProperties: false
      properties:
        apiKey:
          type: string
      required:
        - apiKey
      type: object
    CreateApiKeyRequestBody:
      additionalProperties: false
      properties:
        expiration:
          format: date-time
          type: string
        userId:
          description: Owning user id; empty for a legacy all-access key.
          format: uint64
          type: string
      type: object
    CreatePreAuthKeyRequestBody:
      additionalProperties: false
      properties:
        aclTags:
          items:
            type: string
          type:
            - array
            - "null"
        ephemeral:
          type: boolean
        expiration:
          format: date-time
          type: string
        groupIds:
          description: Groups a node registered with the key joins.
          items:
            type: string
          type:
            - array
            - "null"
        preauthorized:
          description: Defaults to true.
          type: boolean
        reusable:
          type: boolean
        user:
          format: uint64
          type: string
      type: object
    CreateUserRequestBody:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        name:
          type: string
        pictureUrl:
          type: string
      type: object
    CustomAttribute:
      additionalProperties: false
      properties:
        comment:
          type: string
        expiresAt:
          format: date-time
          type: string
        key:
          type: string
        value: {}
      required:
        - key
        - value
      type: object
    DERPRegion:
      additionalProperties: false
      properties:
        code:
          type: string
        embedded:
          description: Served by this headscale.
          type: boolean
        id:
          format: int64
          type: integer
        name:
          type: string
        nodes:
          format: int64
          type: integer
      required:
        - id
        - code
        - name
        - nodes
        - embedded
      type: object
    DNS:
      additionalProperties: false
      properties:
        baseDomain:
          description: From the config file.
          type: string
        effective:
          $ref: "#/components/schemas/DNSSettings"
          description: What clients receive.
        extraRecordsPath:
          description: Set when a file owns the extra records.
          type: string
        fromFile:
          $ref: "#/components/schemas/DNSSettings"
          description: The config file's values.
        magicDns:
          description: From the config file.
          type: boolean
        overridden:
          description: Settings set through the API are in use.
          type: boolean
      required:
        - magicDns
        - baseDomain
        - effective
        - fromFile
        - overridden
        - extraRecordsPath
      type: object
    DNSRecord:
      additionalProperties: false
      properties:
        name:
          description: Fully qualified name, without trailing dot.
          type: string
        type:
          description: A or AAAA; empty picks one from the value.
          enum:
            - ""
            - A
            - AAAA
          type: string
        value:
          type: string
      required:
        - name
        - type
        - value
      type: object
    DNSSettings:
      additionalProperties: false
      properties:
        extraRecords:
          items:
            $ref: "#/components/schemas/DNSRecord"
          type: array
        nameservers:
          description: IP, IP:port, https or tls URL.
          items:
            type: string
          type: array
        overrideLocalDns:
          description: Used for every query.
          type: boolean
        searchDomains:
          items:
            type: string
          type: array
        splitNameservers:
          additionalProperties:
            items:
              type: string
            type:
              - array
              - "null"
          type: object
      required:
        - nameservers
        - overrideLocalDns
        - splitNameservers
        - searchDomains
        - extraRecords
      type: object
    DebugCreateNodeRequestBody:
      additionalProperties: false
      properties:
        key:
          type: string
        name:
          type: string
        routes:
          items:
            type: string
          type:
            - array
            - "null"
        user:
          type: string
      type: object
    DeleteAPIKeyOutputBody:
      additionalProperties: false
      type: object
    DeleteNodeOutputBody:
      additionalProperties: false
      type: object
    DeletePreAuthKeyOutputBody:
      additionalProperties: false
      type: object
    DeleteUserOutputBody:
      additionalProperties: false
      type: object
    EmptyOutputBody:
      additionalProperties: false
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ExpireAPIKeyOutputBody:
      additionalProperties: false
      type: object
    ExpireApiKeyRequestBody:
      additionalProperties: false
      properties:
        id:
          format: uint64
          type: string
        prefix:
          type: string
      type: object
    ExpireNodeRequestBody:
      additionalProperties: false
      properties:
        disableExpiry:
          type: boolean
        expiry:
          format: date-time
          type: string
      type: object
    ExpirePreAuthKeyOutputBody:
      additionalProperties: false
      type: object
    ExpirePreAuthKeyRequestBody:
      additionalProperties: false
      properties:
        id:
          format: uint64
          type: string
      type: object
    Group:
      additionalProperties: false
      properties:
        builtin:
          description: Empty for operator-made groups, "all" for the builtin group.
          type: string
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        expiries:
          items:
            $ref: "#/components/schemas/GroupMemberExpiry"
          type: array
        id:
          format: uint64
          type: string
        name:
          type: string
        nodeIds:
          items:
            type: string
          type: array
        requestable:
          description: Whether members may request to join the group for a while.
          type: boolean
        updatedAt:
          format: date-time
          type: string
        userIds:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - description
        - builtin
        - requestable
        - nodeIds
        - userIds
        - expiries
        - createdAt
        - updatedAt
      type: object
    GroupMemberExpiry:
      additionalProperties: false
      properties:
        expiresAt:
          format: date-time
          type: string
        nodeId:
          format: uint64
          type: string
        userId:
          format: uint64
          type: string
      required:
        - expiresAt
      type: object
    GroupMemberRequestBody:
      additionalProperties: false
      properties:
        expiresAt:
          description: When the membership ends; omitted means for good.
          format: date-time
          type: string
        nodeId:
          format: uint64
          type: string
        userId:
          format: uint64
          type: string
      type: object
    GroupOutputBody:
      additionalProperties: false
      properties:
        group:
          $ref: "#/components/schemas/Group"
      required:
        - group
      type: object
    GroupRequestBody:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        nodeIds:
          items:
            type: string
          type: array
        requestable:
          description: Whether members may ask to join for a while.
          type: boolean
        userIds:
          items:
            type: string
          type: array
      required:
        - name
      type: object
    HealthResponseBody:
      additionalProperties: false
      properties:
        databaseConnectivity:
          type: boolean
      required:
        - databaseConnectivity
      type: object
    ListAPIKeysOutputBody:
      additionalProperties: false
      properties:
        apiKeys:
          items:
            $ref: "#/components/schemas/ApiKey"
          type: array
      required:
        - apiKeys
      type: object
    ListAuditOutputBody:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
        nextBefore:
          type: string
      required:
        - events
        - nextBefore
      type: object
    ListGroupsOutputBody:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/Group"
          type: array
      required:
        - groups
      type: object
    ListLogStreamsOutputBody:
      additionalProperties: false
      properties:
        logStreams:
          items:
            $ref: "#/components/schemas/LogStream"
          type: array
      required:
        - logStreams
      type: object
    ListNetworksOutputBody:
      additionalProperties: false
      properties:
        networks:
          items:
            $ref: "#/components/schemas/Network"
          type: array
      required:
        - networks
      type: object
    ListNodesOutputBody:
      additionalProperties: false
      properties:
        nodes:
          items:
            $ref: "#/components/schemas/Node"
          type: array
      required:
        - nodes
      type: object
    ListPosturesOutputBody:
      additionalProperties: false
      properties:
        geoIpAvailable:
          type: boolean
        postures:
          items:
            $ref: "#/components/schemas/Posture"
          type: array
      required:
        - postures
        - geoIpAvailable
      type: object
    ListPreAuthKeysOutputBody:
      additionalProperties: false
      properties:
        preAuthKeys:
          items:
            $ref: "#/components/schemas/PreAuthKey"
          type: array
      required:
        - preAuthKeys
      type: object
    ListRequestsOutputBody:
      additionalProperties: false
      properties:
        canDecide:
          type: boolean
        requests:
          items:
            $ref: "#/components/schemas/AccessRequest"
          type: array
      required:
        - requests
        - canDecide
      type: object
    ListRulesOutputBody:
      additionalProperties: false
      properties:
        policyFileEnforces:
          type: boolean
        rules:
          items:
            $ref: "#/components/schemas/AccessRule"
          type: array
      required:
        - rules
        - policyFileEnforces
      type: object
    ListUsersOutputBody:
      additionalProperties: false
      properties:
        users:
          items:
            $ref: "#/components/schemas/User"
          type: array
      required:
        - users
      type: object
    ListWebhooksOutputBody:
      additionalProperties: false
      properties:
        webhooks:
          items:
            $ref: "#/components/schemas/Webhook"
          type: array
      required:
        - webhooks
      type: object
    LogStream:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        createdByUserId:
          format: uint64
          type: string
        delivered:
          format: int64
          minimum: 0
          type: integer
        destination:
          type: string
        dropped:
          format: int64
          minimum: 0
          type: integer
        enabled:
          type: boolean
        hasToken:
          type: boolean
        id:
          format: uint64
          type: string
        lastDeliveryAt:
          format: date-time
          type:
            - string
            - "null"
        lastDeliveryStatus:
          type: string
        name:
          type: string
        updatedAt:
          format: date-time
          type: string
        url:
          type: string
      required:
        - id
        - name
        - destination
        - url
        - hasToken
        - enabled
        - createdByUserId
        - createdAt
        - updatedAt
        - lastDeliveryAt
        - lastDeliveryStatus
        - delivered
        - dropped
      type: object
    LogStreamOutputBody:
      additionalProperties: false
      properties:
        logStream:
          $ref: "#/components/schemas/LogStream"
      required:
        - logStream
      type: object
    LogStreamRequestBody:
      additionalProperties: false
      properties:
        destination:
          enum:
            - http
            - splunk
            - elastic
            - datadog
            - axiom
            - loki
          type: string
        enabled:
          type: boolean
        name:
          maxLength: 100
          minLength: 1
          type: string
        token:
          maxLength: 4096
          type: string
        url:
          type: string
      required:
        - name
        - destination
        - url
      type: object
    LogStreamTestOutputBody:
      additionalProperties: false
      properties:
        delivered:
          type: boolean
        status:
          description: HTTP status or the error text.
          type: string
      required:
        - delivered
        - status
      type: object
    Network:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        enabled:
          type: boolean
        exitNode:
          description: The prefixes are the exit routes.
          type: boolean
        groupIds:
          description: Groups whose machines get the routes.
          items:
            type: string
          type: array
        id:
          format: uint64
          type: string
        name:
          type: string
        prefixes:
          items:
            type: string
          type: array
        routerNodeIds:
          items:
            type: string
          type: array
        routers:
          description: The routers with what they advertise and serve.
          items:
            $ref: "#/components/schemas/NetworkRouter"
          type: array
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - enabled
        - exitNode
        - prefixes
        - routerNodeIds
        - groupIds
        - routers
        - createdAt
        - updatedAt
      type: object
    NetworkEnabledInputBody:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
      required:
        - enabled
      type: object
    NetworkOutputBody:
      additionalProperties: false
      properties:
        network:
          $ref: "#/components/schemas/Network"
      required:
        - network
      type: object
    NetworkRequestBody:
      additionalProperties: false
      properties:
        description:
          type: string
        enabled:
          description: Defaults to true.
          type: boolean
        groupIds:
          description: Groups whose machines get the routes.
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        prefixes:
          description: CIDRs or addresses.
          items:
            type: string
          type:
            - array
            - "null"
        routerNodeIds:
          description: Nodes that route the prefixes.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - prefixes
        - groupIds
      type: object
    NetworkRouter:
      additionalProperties: false
      properties:
        missingPrefixes:
          items:
            type: string
          type: array
        name:
          type: string
        nodeId:
          format: uint64
          type: string
        online:
          type: boolean
        primaryPrefixes:
          items:
            type: string
          type: array
      required:
        - nodeId
        - name
        - online
        - missingPrefixes
        - primaryPrefixes
      type: object
    Node:
      additionalProperties: false
      properties:
        approved:
          description: false while the node waits for an administrator.
          type: boolean
        approvedAt:
          format: date-time
          type:
            - string
            - "null"
        approvedRoutes:
          items:
            type: string
          type: array
        availableRoutes:
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
        discoKey:
          type: string
        expiry:
          format: date-time
          type:
            - string
            - "null"
        givenName:
          type: string
        globalExitNode:
          description: true when every client is told to prefer this exit node.
          type: boolean
        id:
          format: uint64
          type: string
        ipAddresses:
          items:
            type: string
          type: array
        lastSeen:
          format: date-time
          type:
            - string
            - "null"
        machineKey:
          type: string
        name:
          type: string
        nodeKey:
          type: string
        online:
          type: boolean
        preAuthKey:
          $ref: "#/components/schemas/NodePreAuthKey"
        registerMethod:
          enum:
            - REGISTER_METHOD_UNSPECIFIED
            - REGISTER_METHOD_AUTH_KEY
            - REGISTER_METHOD_CLI
            - REGISTER_METHOD_OIDC
          type: string
        sharedWith:
          description: IDs of the users the node is shared with.
          items:
            type: string
          type: array
        subnetRoutes:
          items:
            type: string
          type: array
        suspended:
          description: true while an administrator has suspended the node.
          type: boolean
        suspendedAt:
          format: date-time
          type:
            - string
            - "null"
        tags:
          items:
            type: string
          type: array
        user:
          $ref: "#/components/schemas/User"
      required:
        - id
        - machineKey
        - nodeKey
        - discoKey
        - ipAddresses
        - name
        - user
        - lastSeen
        - expiry
        - preAuthKey
        - createdAt
        - approved
        - approvedAt
        - suspended
        - suspendedAt
        - registerMethod
        - givenName
        - online
        - approvedRoutes
        - availableRoutes
        - subnetRoutes
        - tags
