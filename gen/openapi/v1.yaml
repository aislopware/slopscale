      parameters:
        - description: Keep events by this user.
          explode: false
          in: query
          name: actorUserId
          schema:
            description: Keep events by this user.
            type: string
        - description: One action, or a prefix ending in a dot.
          explode: false
          in: query
          name: action
          schema:
            description: One action, or a prefix ending in a dot.
            type: string
        - explode: false
          in: query
          name: targetKind
          schema:
            type: string
        - explode: false
          in: query
          name: targetId
          schema:
            type: string
        - description: RFC 3339; events at or after this time.
          explode: false
          in: query
          name: since
          schema:
            description: RFC 3339; events at or after this time.
            format: date-time
            type: string
        - description: RFC 3339; events before this time.
          explode: false
          in: query
          name: until
          schema:
            description: RFC 3339; events before this time.
            format: date-time
            type: string
        - description: "Page: events with an ID below this one."
          explode: false
          in: query
          name: before
          schema:
            description: "Page: events with an ID below this one."
            format: uint64
            type: string
        - description: Page size, at most 500.
          explode: false
          in: query
          name: limit
          schema:
            description: Page size, at most 500.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
