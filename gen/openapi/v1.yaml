components:
  schemas:
    AccessDecisionBody:
      additionalProperties: false
      properties:
        durationSeconds:
          format: int64
          type: integer
        note:
          type: string
      type: object
    AccessGraph:
      additionalProperties: false
      properties:
        edges:
          items:
            $ref: "#/components/schemas/AccessGraphEdge"
          type: array
        enforcing:
          description: Whether a packet filter is in force; without one every machine reaches every other.
          type: boolean
        nodes:
          items:
            $ref: "#/components/schemas/AccessGraphNode"
          type: array
        reachable:
          items:
            $ref: "#/components/schemas/AccessGraphEdge"
          type: array
        reachedBy:
          items:
            $ref: "#/components/schemas/AccessGraphEdge"
          type: array
      required:
        - nodes
        - edges
        - reachable
        - reachedBy
        - enforcing
      type: object
    AccessGraphEdge:
      additionalProperties: false
      properties:
        capabilities:
          items:
            type: string
          type: array
        dst:
          format: uint64
          type: string
        ports:
          items:
            type: string
          type: array
        routes:
          items:
            type: string
          type: array
        src:
          format: uint64
          type: string
        sshCheck:
          type: boolean
        sshUsers:
          items:
            type: string
          type: array
      required:
        - src
        - dst
        - ports
        - routes
        - sshUsers
        - sshCheck
        - capabilities
      type: object
    AccessGraphNode:
      additionalProperties: false
      properties:
        id:
          format: uint64
          type: string
        name:
          type: string
        online:
          type: boolean
        routes:
          items:
            type: string
          type: array
        tags:
          items:
            type: string
          type: array
        user:
          description: The owner's login, empty when tagged.
          type: string
      required:
        - id
        - name
        - user
        - tags
        - online
        - routes
      type: object
    AccessRequest:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        decidedAt:
          format: date-time
          type:
            - string
            - "null"
        decidedBy:
          type: string
        durationSeconds:
          format: int64
          type: integer
        expiresAt:
          format: date-time
          type:
            - string
            - "null"
        groupId:
          format: uint64
          type: string
        id:
          format: uint64
          type: string
        nodeId:
          format: uint64
          type: string
        note:
          description: What the approver said.
          type: string
        reason:
          type: string
        status:
          description: One of pending, approved, denied, cancelled.
          type: string
        userId:
          format: uint64
          type: string
      required:
        - id
        - userId
        - groupId
        - reason
        - durationSeconds
        - status
        - decidedBy
        - note
        - createdAt
        - decidedAt
        - expiresAt
      type: object
    AccessRequestBody:
      additionalProperties: false
      properties:
        durationSeconds:
          description: Between 300 (five minutes) and 2592000 (thirty days).
          format: int64
          type: integer
        groupId:
          format: uint64
          type: string
        nodeId:
          format: uint64
          type: string
        reason:
          type: string
      required:
        - groupId
        - durationSeconds
      type: object
    AccessRequestOption:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          format: uint64
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    AccessRule:
      additionalProperties: false
      properties:
        bidirectional:
          type: boolean
        builtin:
          type: string
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        destinationGroupIds:
          items:
            type: string
          type: array
        enabled:
          type: boolean
        expiresAt:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uint64
          type: string
        name:
          type: string
        ports:
          description: Comma-separated ports and ranges, empty for every port.
          type: string
        postureIds:
          items:
            type: string
          type: array
        protocol:
          description: One of all, tcp, udp, icmp.
          type: string
        sourceGroupIds:
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - enabled
        - protocol
        - ports
        - bidirectional
        - sourceGroupIds
        - destinationGroupIds
        - postureIds
        - expiresAt
        - builtin
        - createdAt
        - updatedAt
      type: object
    AccessRuleRequestBody:
      additionalProperties: false
      properties:
        bidirectional:
          type: boolean
        description:
          type: string
        destinationGroupIds:
          items:
            type: string
          type:
            - array
            - "null"
        enabled:
          description: Defaults to true.
          type: boolean
        expiresAt:
          format: date-time
          type: string
        name:
          type: string
        ports:
          type: string
        postureIds:
          description: Postures a source must satisfy, any one of them.
          items:
            type: string
          type:
            - array
            - "null"
        protocol:
          description: One of all, tcp, udp, icmp.
          type: string
        sourceGroupIds:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - protocol
        - sourceGroupIds
        - destinationGroupIds
      type: object
    ApiKey:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type:
            - string
            - "null"
        description:
          type: string
        expiration:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uint64
          type: string
        lastSeen:
          format: date-time
          type:
            - string
            - "null"
        prefix:
          type: string
        scopes:
          description: Scopes the key is limited to; empty means its owner's whole role.
          items:
            type: string
          type: array
        userId:
          description: Owning user id; null for a legacy key.
          format: uint64
          type:
            - string
            - "null"
      required:
        - id
        - prefix
        - expiration
        - createdAt
        - lastSeen
        - userId
        - scopes
        - description
      type: object
    App:
      additionalProperties: false
      properties:
        connectors:
          description: The tags of the connector nodes, or * for every node running the connector.
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        domains:
          description: The domains the connectors resolve and route, example.com or *.example.com.
          items:
            type: string
          type: array
        id:
          format: uint64
          type: string
        name:
          type: string
        nodes:
          description: The connector nodes the selectors pick, with the routes they advertise.
          items:
            $ref: "#/components/schemas/AppNode"
          type: array
        routes:
          description: Routes the connectors always advertise, next to the addresses they learn.
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - domains
        - connectors
        - routes
        - nodes
        - createdAt
        - updatedAt
      type: object
    AppNode:
      additionalProperties: false
      properties:
        connector:
          description: true while the client reports running the connector service.
          type: boolean
        learnedRoutes:
          description: Single-address routes the node advertises.
          format: int64
          type: integer
        name:
          description: The node's given name.
          type: string
        nodeId:
          format: uint64
          type: string
        online:
          type: boolean
        pending:
          description: Advertised routes that are not approved yet.
          format: int64
          type: integer
      required:
        - nodeId
        - name
        - online
        - connector
        - learnedRoutes
        - pending
      type: object
    AppOutputBody:
      additionalProperties: false
      properties:
        app:
          $ref: "#/components/schemas/App"
      required:
        - app
      type: object
    AppRequestBody:
      additionalProperties: false
      properties:
        connectors:
          description: Tags of the connector nodes; empty means all connectors.
          items:
            type: string
          type:
            - array
            - "null"
        description:
          type: string
        domains:
          description: example.com or *.example.com.
          items:
            type: string
          type:
            - array
            - "null"
        name:
          minLength: 1
          type: string
        routes:
          description: CIDRs the connectors always advertise; no default routes.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        action:
          description: "What happened, dotted and object first: user.role.set, node.delete."
          type: string
        actorKind:
          description: local, api_key, oauth, session, node or system.
          type: string
        actorName:
          description: The actor's user name, or the credential's prefix.
          type: string
        actorUserId:
          description: The user behind the actor; empty for a credential without one.
          type: string
        createdAt:
          format: date-time
          type: string
        detail:
          additionalProperties: {}
          description: Action-specific fields.
          type: object
        id:
          format: uint64
          type: string
        outcome:
          description: The HTTP status the request ended with.
          format: int64
          type: integer
        remoteAddr:
          type: string
        targetId:
          type: string
        targetKind:
          type: string
        targetName:
          type: string
      required:
        - id
        - createdAt
        - actorKind
        - actorUserId
        - actorName
        - action
        - targetKind
        - targetId
        - targetName
        - outcome
        - detail
        - remoteAddr
      type: object
    AuthApproveOutputBody:
      additionalProperties: false
      type: object
    AuthApproveRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
      type: object
    AuthRegisterOutputBody:
      additionalProperties: false
      properties:
        node:
          $ref: "#/components/schemas/Node"
      required:
        - node
      type: object
    AuthRegisterRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
        user:
          type: string
      type: object
    AuthRejectOutputBody:
      additionalProperties: false
      type: object
    AuthRejectRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
      type: object
    BackfillNodeIPsOutputBody:
      additionalProperties: false
      properties:
        changes:
          items:
            type: string
          type: array
      required:
        - changes
      type: object
    CheckPolicyOutputBody:
      additionalProperties: false
      type: object
    ConsoleAuth:
      additionalProperties: false
      properties:
        oidc:
          $ref: "#/components/schemas/ConsoleOIDC"
      type: object
    ConsoleOIDC:
      additionalProperties: false
      properties:
        loginPath:
          type: string
        provider:
          type: string
      required:
        - provider
        - loginPath
      type: object
    ConsoleSession:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        current:
          description: True for the session making this request.
          type: boolean
        expiresAt:
          format: date-time
          type: string
        id:
          format: uint64
          type: string
        lastSeenAt:
          description: When it last made a request; written at most once a minute.
          format: date-time
          type: string
        remoteAddr:
          description: Where the browser signed in from; empty for an older session.
          type: string
        user:
          $ref: "#/components/schemas/User"
        userAgent:
          description: The browser that signed in; empty for an older session.
          type: string
      required:
        - id
        - user
        - createdAt
        - expiresAt
        - lastSeenAt
        - remoteAddr
        - userAgent
        - current
      type: object
    CreateAPIKeyOutputBody:
      additionalProperties: false
      properties:
        apiKey:
          type: string
      required:
        - apiKey
      type: object
    CreateApiKeyRequestBody:
      additionalProperties: false
      properties:
        description:
          description: What the key is for.
          type: string
        expiration:
          format: date-time
          type: string
        scopes:
          description: Scopes to limit the key to; empty keeps the owner's whole role.
          items:
            type: string
          type:
            - array
            - "null"
        userId:
          description: Owning user id; empty for a legacy all-access key.
          format: uint64
          type: string
      type: object
    CreateInviteRequestBody:
      additionalProperties: false
      properties:
        email:
          description: The invited address.
          type: string
        expiry:
          description: A Go duration; 720h at most, 168h by default.
          type: string
        groupIds:
          description: Groups the invited user joins.
          items:
            type: string
          type: array
        role:
          description: owner is refused; defaults to member.
          type: string
      required:
        - email
      type: object
    CreateOAuthClientOutputBody:
      additionalProperties: false
      properties:
        clientSecret:
          type: string
        oauthClient:
          $ref: "#/components/schemas/OAuthClient"
      required:
        - oauthClient
      type: object
    CreateOAuthClientRequestBody:
      additionalProperties: false
      properties:
        audience:
          description: "Federated: the audience the JWT must carry."
          type: string
        customClaimRules:
          additionalProperties:
            type: string
          description: "Federated: further claims the JWT must carry."
          type: object
        description:
          description: What the client is for.
          type: string
        issuer:
          description: "Federated: the https URL of the OIDC issuer."
          type: string
        keyType:
          description: client (the default) or federated.
          enum:
            - ""
            - client
            - federated
          type: string
        scopes:
          description: Scopes the client may grant; at least one.
          items:
            type: string
          minItems: 1
          type: array
        subject:
          description: "Federated: the subject the JWT must equal."
          type: string
        tags:
          description: Tags the client may put on its tokens.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - scopes
      type: object
    CreatePreAuthKeyRequestBody:
      additionalProperties: false
      properties:
        aclTags:
          items:
            type: string
          type:
            - array
            - "null"
        ephemeral:
          type: boolean
        expiration:
          format: date-time
          type: string
        groupIds:
          description: Groups a node registered with the key joins.
          items:
            type: string
          type:
            - array
            - "null"
        preauthorized:
          description: Defaults to true.
          type: boolean
        reusable:
          type: boolean
        user:
          format: uint64
          type: string
      type: object
    CreateSSHSessionRequestBody:
      additionalProperties: false
      properties:
        nodeId:
          description: The node to open a session to.
          format: uint64
          type: string
      required:
        - nodeId
      type: object
    CreateServiceRequestBody:
      additionalProperties: false
      properties:
        comment:
          type: string
        displayName:
          type: string
        name:
          description: svc:<label> or the label alone; a DNS label.
          minLength: 1
          type: string
        ports:
          description: tcp:443, udp:53-60 or tcp:*.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
      type: object
    CreateUserRequestBody:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        name:
          type: string
        pictureUrl:
          type: string
      type: object
    CustomAttribute:
      additionalProperties: false
      properties:
        comment:
          type: string
        expiresAt:
          format: date-time
          type: string
        key:
          type: string
        value: {}
      required:
        - key
        - value
      type: object
    DERP:
      additionalProperties: false
      properties:
        autoAddEmbedded:
          type: boolean
        effective:
          $ref: "#/components/schemas/DERPSettings"
          description: What the server runs with.
        fetchError:
          type: string
        fetchedAt:
          format: date-time
          type: string
        fromFile:
          $ref: "#/components/schemas/DERPSettings"
          description: The config file's values.
        overridden:
          description: Settings set through the API are in use.
          type: boolean
        paths:
          items:
            type: string
          type: array
        regions:
          items:
            $ref: "#/components/schemas/DERPMapRegion"
          type: array
        relayAvailable:
          type: boolean
        relayRunning:
          type: boolean
        serverUrl:
          description: Where the embedded relay is reached.
          type: string
        stunAddr:
          type: string
      required:
        - effective
        - fromFile
        - overridden
        - paths
        - autoAddEmbedded
        - relayAvailable
        - relayRunning
        - stunAddr
        - serverUrl
        - regions
        - fetchedAt
        - fetchError
      type: object
    DERPCustomRegion:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/DERPRelay"
          type: array
      required:
        - id
        - code
      type: object
    DERPLatencyMachine:
      additionalProperties: false
      properties:
        hardNat:
          description: true behind a NAT whose mapping varies by destination.
          type: boolean
        homeMs:
          description: The round trip to the home region, 0 when unmeasured.
          format: double
          type: number
        linkType:
          type: string
        name:
          type: string
        nodeId:
          format: uint64
          type: string
        online:
          type: boolean
        preferredDerp:
          format: int64
          type: integer
      required:
        - nodeId
        - name
        - online
        - preferredDerp
        - homeMs
        - hardNat
        - linkType
      type: object
    DERPLatencyRegion:
      additionalProperties: false
      properties:
        code:
          type: string
        inMap:
          description: Whether the relay map still has the region.
          type: boolean
        maxMs:
          description: The worst round trip.
          format: double
          type: number
        medianMs:
          description: The median round trip.
          format: double
          type: number
        minMs:
          description: The best round trip among them.
          format: double
          type: number
        name:
          type: string
        p90Ms:
          description: The 90th percentile round trip.
          format: double
          type: number
        preferredBy:
          description: Machines that home on the region.
          format: int64
          type: integer
        regionId:
          format: int64
          type: integer
        samples:
          description: Machines that measured the region.
          format: int64
          type: integer
      required:
        - regionId
        - code
        - name
        - preferredBy
        - samples
        - minMs
        - medianMs
        - p90Ms
        - maxMs
        - inMap
      type: object
    DERPLatencyReport:
      additionalProperties: false
      properties:
        hardNat:
          description: Machines behind a hard NAT, which relay most of their traffic.
          format: int64
          type: integer
        machines:
          items:
            $ref: "#/components/schemas/DERPLatencyMachine"
          type: array
        regions:
          items:
            $ref: "#/components/schemas/DERPLatencyRegion"
          type: array
        reporting:
          description: Machines that reported a measurement.
          format: int64
          type: integer
        silent:
          description: Machines that reported none.
          format: int64
          type: integer
      required:
        - regions
        - reporting
        - silent
        - hardNat
        - machines
      type: object
    DERPMapRegion:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          format: int64
          type: integer
        name:
          type: string
        nodes:
          format: int64
          type: integer
        source:
          enum:
            - tailscale
            - url
            - file
            - custom
            - embedded
            - config
          type: string
      required:
        - id
        - code
        - name
        - nodes
        - source
      type: object
    DERPRelay:
      additionalProperties: false
      properties:
        canPort80:
          type: boolean
        derpPort:
          format: int64
          type: integer
        hostName:
          type: string
        ipv4:
          type: string
        ipv6:
          type: string
        name:
          type: string
        stunOnly:
          type: boolean
        stunPort:
          format: int64
          type: integer
      required:
        - hostName
      type: object
    DERPServerSettings:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        ipv4:
          type: string
        ipv6:
          type: string
        regionCode:
          type: string
        regionId:
          format: int64
          type: integer
        regionName:
          type: string
        stunAddr:
          type: string
        stunEnabled:
          type: boolean
        verifyClients:
          type: boolean
      required:
        - enabled
      type: object
    DERPSettings:
      additionalProperties: false
      properties:
        autoUpdate:
          type: boolean
        regions:
          items:
            $ref: "#/components/schemas/DERPCustomRegion"
          type: array
        server:
          $ref: "#/components/schemas/DERPServerSettings"
        updateFrequency:
          type: string
        urls:
          items:
            type: string
          type: array
      required:
        - urls
        - regions
        - autoUpdate
        - updateFrequency
        - server
      type: object
    DNS:
      additionalProperties: false
      properties:
        baseDomain:
          description: From the config file.
          type: string
        effective:
          $ref: "#/components/schemas/DNSSettings"
          description: What clients receive.
        extraRecordsPath:
          description: Set when a file owns the extra records.
          type: string
        fromFile:
          $ref: "#/components/schemas/DNSSettings"
          description: The config file's values.
        magicDns:
          description: From the config file.
          type: boolean
        overridden:
          description: Settings set through the API are in use.
          type: boolean
      required:
        - magicDns
        - baseDomain
        - effective
        - fromFile
        - overridden
        - extraRecordsPath
      type: object
    DNSRecord:
      additionalProperties: false
      properties:
        name:
          description: Fully qualified name, without trailing dot.
          type: string
        type:
          description: A or AAAA; empty picks one from the value.
          enum:
            - ""
            - A
            - AAAA
          type: string
        value:
          type: string
      required:
        - name
        - type
        - value
      type: object
    DNSRule:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        domains:
          description: Zones the nameservers answer for.
          items:
            type: string
          type: array
        enabled:
          type: boolean
        groupIds:
          description: Groups whose machines receive the rule.
          items:
            type: string
          type: array
        id:
          format: uint64
          type: string
        name:
          type: string
        nameservers:
          description: Resolvers, as IP, IP:port or a provider's DoH URL.
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - enabled
        - domains
        - nameservers
        - groupIds
        - createdAt
        - updatedAt
      type: object
    DNSRuleRequestBody:
      additionalProperties: false
      properties:
        description:
          type: string
        domains:
          description: Zones the nameservers answer for.
          items:
            type: string
          type:
            - array
            - "null"
        enabled:
          description: Defaults to true.
          type: boolean
        groupIds:
          description: Groups whose machines receive the rule.
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        nameservers:
          description: Resolvers, as IP, IP:port or a provider's DoH URL.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - domains
        - nameservers
        - groupIds
      type: object
    DNSSettings:
      additionalProperties: false
