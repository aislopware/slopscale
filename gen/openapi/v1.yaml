components:
  schemas:
    AccessRule:
      additionalProperties: false
      properties:
        bidirectional:
          type: boolean
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        destinationGroupIds:
          items:
            type: string
          type: array
        enabled:
          type: boolean
        id:
          format: uint64
          type: string
        name:
          type: string
        ports:
          description: Comma-separated ports and ranges, empty for every port.
          type: string
        protocol:
          description: One of all, tcp, udp, icmp.
          type: string
        sourceGroupIds:
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - description
        - enabled
        - protocol
        - ports
        - bidirectional
        - sourceGroupIds
        - destinationGroupIds
        - createdAt
        - updatedAt
      type: object
    AccessRuleRequestBody:
      additionalProperties: false
      properties:
        bidirectional:
          type: boolean
        description:
          type: string
        destinationGroupIds:
          items:
            type: string
          type:
            - array
            - "null"
        enabled:
          description: Defaults to true.
          type: boolean
        name:
          type: string
        ports:
          type: string
        protocol:
          description: One of all, tcp, udp, icmp.
          type: string
        sourceGroupIds:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - protocol
        - sourceGroupIds
        - destinationGroupIds
      type: object
    ApiKey:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type:
            - string
            - "null"
        expiration:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uint64
          type: string
        lastSeen:
          format: date-time
          type:
            - string
            - "null"
        prefix:
          type: string
        userId:
          description: Owning user id; null for a legacy key.
          format: uint64
          type:
            - string
            - "null"
      required:
        - id
        - prefix
        - expiration
        - createdAt
        - lastSeen
        - userId
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        action:
          description: "What happened, dotted and object first: user.role.set, node.delete."
          type: string
        actorKind:
          description: local, api_key, oauth, session or system.
          type: string
        actorName:
          description: The actor's user name, or the credential's prefix.
          type: string
        actorUserId:
          description: The user behind the actor; empty for a credential without one.
          type: string
        createdAt:
          format: date-time
          type: string
        detail:
          additionalProperties: {}
          description: Action-specific fields.
          type: object
        id:
          format: uint64
          type: string
        outcome:
          description: The HTTP status the request ended with.
          format: int64
          type: integer
        remoteAddr:
          type: string
        targetId:
          type: string
        targetKind:
          type: string
        targetName:
          type: string
      required:
        - id
        - createdAt
        - actorKind
        - actorUserId
        - actorName
        - action
        - targetKind
        - targetId
        - targetName
        - outcome
        - detail
        - remoteAddr
      type: object
    AuthApproveOutputBody:
      additionalProperties: false
      type: object
    AuthApproveRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
      type: object
    AuthRegisterOutputBody:
      additionalProperties: false
      properties:
        node:
          $ref: "#/components/schemas/Node"
      required:
        - node
      type: object
    AuthRegisterRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
        user:
          type: string
      type: object
    AuthRejectOutputBody:
      additionalProperties: false
      type: object
    AuthRejectRequestBody:
      additionalProperties: false
      properties:
        authId:
          type: string
      type: object
    BackfillNodeIPsOutputBody:
      additionalProperties: false
      properties:
        changes:
          items:
            type: string
          type: array
      required:
        - changes
      type: object
    CheckPolicyOutputBody:
      additionalProperties: false
      type: object
    ConsoleAuth:
      additionalProperties: false
      properties:
        oidc:
          $ref: "#/components/schemas/ConsoleOIDC"
      type: object
    ConsoleOIDC:
      additionalProperties: false
      properties:
        loginPath:
          type: string
        provider:
          type: string
      required:
        - provider
        - loginPath
      type: object
    CreateAPIKeyOutputBody:
      additionalProperties: false
      properties:
        apiKey:
          type: string
      required:
        - apiKey
      type: object
    CreateApiKeyRequestBody:
      additionalProperties: false
      properties:
        expiration:
          format: date-time
          type: string
        userId:
          description: Owning user id; empty for a legacy all-access key.
          format: uint64
          type: string
      type: object
    CreatePreAuthKeyRequestBody:
      additionalProperties: false
      properties:
        aclTags:
          items:
            type: string
          type:
            - array
            - "null"
        ephemeral:
          type: boolean
        expiration:
          format: date-time
          type: string
        groupIds:
          description: Groups a node registered with the key joins.
          items:
            type: string
          type:
            - array
            - "null"
        preauthorized:
          description: Defaults to true.
          type: boolean
        reusable:
          type: boolean
        user:
          format: uint64
          type: string
      type: object
    CreateUserRequestBody:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        name:
          type: string
        pictureUrl:
          type: string
      type: object
    DebugCreateNodeRequestBody:
      additionalProperties: false
      properties:
        key:
          type: string
        name:
          type: string
        routes:
          items:
            type: string
          type:
            - array
            - "null"
        user:
          type: string
      type: object
    DeleteAPIKeyOutputBody:
      additionalProperties: false
      type: object
    DeleteNodeOutputBody:
      additionalProperties: false
      type: object
    DeletePreAuthKeyOutputBody:
      additionalProperties: false
      type: object
    DeleteUserOutputBody:
      additionalProperties: false
      type: object
    EmptyOutputBody:
      additionalProperties: false
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ExpireAPIKeyOutputBody:
      additionalProperties: false
      type: object
    ExpireApiKeyRequestBody:
      additionalProperties: false
      properties:
        id:
          format: uint64
          type: string
        prefix:
          type: string
      type: object
    ExpireNodeRequestBody:
      additionalProperties: false
      properties:
        disableExpiry:
          type: boolean
        expiry:
          format: date-time
          type: string
      type: object
    ExpirePreAuthKeyOutputBody:
      additionalProperties: false
      type: object
    ExpirePreAuthKeyRequestBody:
      additionalProperties: false
      properties:
        id:
          format: uint64
          type: string
      type: object
    Group:
      additionalProperties: false
      properties:
        builtin:
          description: Empty for operator-made groups, "all" for the builtin group.
          type: string
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: uint64
          type: string
        name:
          type: string
        nodeIds:
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
        userIds:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - description
        - builtin
        - nodeIds
        - userIds
        - createdAt
        - updatedAt
      type: object
    GroupMemberRequestBody:
      additionalProperties: false
      properties:
        nodeId:
          format: uint64
          type: string
        userId:
          format: uint64
          type: string
      type: object
    GroupOutputBody:
      additionalProperties: false
      properties:
        group:
          $ref: "#/components/schemas/Group"
      required:
        - group
      type: object
    GroupRequestBody:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        nodeIds:
          items:
            type: string
          type: array
        userIds:
          items:
            type: string
          type: array
      required:
        - name
      type: object
    HealthResponseBody:
      additionalProperties: false
      properties:
        databaseConnectivity:
          type: boolean
      required:
        - databaseConnectivity
      type: object
    ListAPIKeysOutputBody:
      additionalProperties: false
      properties:
        apiKeys:
          items:
            $ref: "#/components/schemas/ApiKey"
          type: array
      required:
        - apiKeys
      type: object
    ListAuditOutputBody:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
        nextBefore:
          type: string
      required:
        - events
        - nextBefore
      type: object
    ListGroupsOutputBody:
      additionalProperties: false
      properties:
        groups:
          items:
            $ref: "#/components/schemas/Group"
          type: array
      required:
        - groups
      type: object
    ListNodesOutputBody:
      additionalProperties: false
      properties:
        nodes:
          items:
            $ref: "#/components/schemas/Node"
          type: array
      required:
        - nodes
      type: object
    ListPreAuthKeysOutputBody:
      additionalProperties: false
      properties:
        preAuthKeys:
          items:
            $ref: "#/components/schemas/PreAuthKey"
          type: array
      required:
        - preAuthKeys
      type: object
    ListRulesOutputBody:
      additionalProperties: false
      properties:
        rules:
          items:
            $ref: "#/components/schemas/AccessRule"
          type: array
      required:
        - rules
      type: object
    ListUsersOutputBody:
      additionalProperties: false
      properties:
        users:
          items:
            $ref: "#/components/schemas/User"
          type: array
      required:
        - users
      type: object
    Node:
      additionalProperties: false
      properties:
        approved:
          description: false while the node waits for an administrator.
          type: boolean
        approvedAt:
          format: date-time
          type:
            - string
            - "null"
        approvedRoutes:
          items:
            type: string
          type: array
        availableRoutes:
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
        discoKey:
          type: string
        expiry:
          format: date-time
          type:
            - string
            - "null"
        givenName:
          type: string
        globalExitNode:
          description: true when every client is told to prefer this exit node.
          type: boolean
        id:
          format: uint64
          type: string
        ipAddresses:
          items:
            type: string
          type: array
        lastSeen:
          format: date-time
          type:
            - string
            - "null"
        machineKey:
          type: string
        name:
          type: string
        nodeKey:
          type: string
        online:
          type: boolean
        preAuthKey:
          $ref: "#/components/schemas/NodePreAuthKey"
        registerMethod:
          enum:
            - REGISTER_METHOD_UNSPECIFIED
            - REGISTER_METHOD_AUTH_KEY
            - REGISTER_METHOD_CLI
            - REGISTER_METHOD_OIDC
          type: string
        sharedWith:
          description: IDs of the users the node is shared with.
          items:
            type: string
          type: array
        subnetRoutes:
          items:
            type: string
          type: array
        tags:
          items:
            type: string
          type: array
        user:
          $ref: "#/components/schemas/User"
      required:
        - id
        - machineKey
        - nodeKey
        - discoKey
        - ipAddresses
        - name
        - user
        - lastSeen
        - expiry
        - preAuthKey
        - createdAt
        - approved
        - approvedAt
        - registerMethod
        - givenName
        - online
        - approvedRoutes
        - availableRoutes
        - subnetRoutes
        - tags
        - sharedWith
        - globalExitNode
      type: object
    NodeOutputBody:
      additionalProperties: false
      properties:
        node:
          $ref: "#/components/schemas/Node"
      required:
        - node
      type: object
    NodePreAuthKey:
      additionalProperties: false
      properties:
        aclTags:
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type:
            - string
            - "null"
        ephemeral:
          type: boolean
        expiration:
          format: date-time
          type:
            - string
            - "null"
        id:
          format: uint64
          type: string
        key:
          type: string
        preauthorized:
          type: boolean
        reusable:
          type: boolean
        used:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
        - id
        - key
        - reusable
        - ephemeral
        - used
        - expiration
        - createdAt
        - aclTags
        - preauthorized
      type: object
    PolicyRequestBody:
      additionalProperties: false
      properties:
        policy:
          type: string
      type: object
    PolicyResponseBody:
      additionalProperties: false
      properties:
        policy:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - policy
        - updatedAt
      type: object
    PreAuthKey:
      additionalProperties: false
      properties:
        aclTags:
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
        ephemeral:
          type: boolean
        expiration:
          format: date-time
          type: string
        groupIds:
          description: Groups the registered node joins.
          items:
            type: string
          type: array
        id:
          format: uint64
          type: string
        key:
          type: string
        preauthorized:
          description: Registered nodes skip device approval.
          type: boolean
        reusable:
          type: boolean
        used:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
        - id
        - key
        - reusable
        - ephemeral
        - used
        - expiration
        - createdAt
        - aclTags
        - preauthorized
        - groupIds
      type: object
    PreAuthKeyOutputBody:
      additionalProperties: false
      properties:
        preAuthKey:
          $ref: "#/components/schemas/PreAuthKey"
      required:
        - preAuthKey
      type: object
    RuleOutputBody:
      additionalProperties: false
      properties:
        rule:
          $ref: "#/components/schemas/AccessRule"
      required:
        - rule
      type: object
    SetApprovalRequestBody:
      additionalProperties: false
      properties:
        approved:
          description: false withdraws the approval.
          type: boolean
      type: object
    SetApprovedRoutesRequestBody:
      additionalProperties: false
      properties:
        routes:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    SetGlobalExitNodeRequestBody:
      additionalProperties: false
      properties:
        enabled:
          description: false clears the mark.
          type: boolean
      type: object
    SetTagsRequestBody:
      additionalProperties: false
      properties:
        tags:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    SetUserRoleRequestBody:
      additionalProperties: false
      properties:
        role:
          description: One of owner, admin, network-admin, it-admin, auditor, member.
          type: string
      required:
        - role
      type: object
    Settings:
      additionalProperties: false
      properties:
        devicesApprovalOn:
          description: New nodes wait for an administrator unless they register with a preauthorized key.
          type: boolean
        usersApprovalOn:
          description: Users created by OIDC login wait for an administrator before registering nodes.
          type: boolean
      required:
        - devicesApprovalOn
        - usersApprovalOn
      type: object
    ShareNodeRequestBody:
      additionalProperties: false
      properties:
        userId:
          description: ID of the user to share the node with.
          format: uint64
          type: string
      required:
        - userId
      type: object
    UpdateSettingsRequestBody:
      additionalProperties: false
      properties:
        devicesApprovalOn:
          type: boolean
        usersApprovalOn:
          type: boolean
      type: object
    User:
      additionalProperties: false
      properties:
        approved:
          description: false while the user waits for an administrator.
          type: boolean
        approvedAt:
          format: date-time
          type:
            - string
            - "null"
        createdAt:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          type: string
        id:
          format: uint64
          type: string
        name:
          type: string
        profilePicUrl:
          type: string
        provider:
          type: string
        providerId:
          type: string
        role:
          description: owner, admin, network-admin, it-admin, auditor or member
          type: string
      required:
        - id
        - name
        - createdAt
        - displayName
        - email
        - providerId
        - provider
        - profilePicUrl
        - role
        - approved
        - approvedAt
      type: object
    UserOutputBody:
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
      type: object
    Whoami:
      additionalProperties: false
      properties:
        allAccess:
          type: boolean
        kind:
          description: "How the caller authenticated: local, api_key, oauth or session."
          type: string
        permissions:
          additionalProperties:
            type: boolean
          type: object
        role:
          type: string
        scopes:
          items:
            type: string
          type: array
        user:
          $ref: "#/components/schemas/User"
      required:
        - kind
        - role
        - allAccess
        - scopes
        - permissions
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  description: Headscale control server API.
  title: Headscale API
  version: v1
openapi: 3.1.0
paths:
  /api/v1/access-rule:
    get:
      description: Requires the `policy_file:read` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: listAccessRules
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRulesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List access rules
      tags:
        - Access control
      x-required-scope: policy_file:read
    post:
      description: |-
        Lets the source groups reach the destination groups on the protocol and ports. Rules only allow: once one is enabled, or the policy file has rules, everything not allowed is denied.

        Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: createAccessRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRuleRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create access rule
      tags:
        - Access control
      x-audit-action: access_rule.create
      x-required-scope: policy_file
  /api/v1/access-rule/{id}:
    delete:
      description: Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: deleteAccessRule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Delete access rule
      tags:
        - Access control
      x-audit-action: access_rule.delete
      x-required-scope: policy_file
    get:
      description: Requires the `policy_file:read` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: getAccessRule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get access rule
      tags:
        - Access control
      x-required-scope: policy_file:read
    put:
      description: Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: updateAccessRule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRuleRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Replace access rule
      tags:
        - Access control
      x-audit-action: access_rule.update
      x-required-scope: policy_file
  /api/v1/apikey:
    get:
      operationId: listApiKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIKeysOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List API keys
      tags:
        - ApiKeys
    post:
      description: Any authenticated caller may mint a key for itself; a key for another user, or a legacy key without a user, needs the owner, an admin or the socket.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create API key
      tags:
        - ApiKeys
      x-audit-action: apikey.create
