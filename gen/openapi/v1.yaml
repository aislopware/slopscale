          $ref: "#/components/schemas/DERPServerSettings"
        updateFrequency:
          type: string
        urls:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - server
      type: object
    SetDNSRequestBody:
      additionalProperties: false
      properties:
        extraRecords:
          items:
            $ref: "#/components/schemas/DNSRecord"
          type:
            - array
            - "null"
        nameservers:
          items:
            type: string
          type:
            - array
            - "null"
        overrideLocalDns:
          type: boolean
        searchDomains:
          items:
            type: string
          type:
            - array
            - "null"
        splitNameservers:
          additionalProperties:
            items:
              type: string
            type:
              - array
              - "null"
          type: object
        splitUseWithExitNode:
          additionalProperties:
            items:
              type: string
            type:
              - array
              - "null"
          type: object
        useWithExitNode:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    SetGlobalExitNodeRequestBody:
      additionalProperties: false
      properties:
        enabled:
          description: false clears the mark.
          type: boolean
      type: object
    SetSuspensionRequestBody:
      additionalProperties: false
      properties:
        suspended:
          description: false lifts the suspension.
          type: boolean
      type: object
    SetTagsRequestBody:
      additionalProperties: false
      properties:
        tags:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    SetUserRoleRequestBody:
      additionalProperties: false
      properties:
        role:
          description: One of owner, admin, network-admin, it-admin, auditor, member.
          type: string
      required:
        - role
      type: object
    Settings:
      additionalProperties: false
      properties:
        defaultKeyExpiryDays:
          format: int64
          type: integer
        deviceAttributesOn:
          type: boolean
        devicesApprovalOn:
          description: New nodes wait for an administrator unless they register with a preauthorized key.
          type: boolean
        embeddedRecorder:
          type: boolean
        keyExpiryDays:
          format: int64
          type: integer
        postureIdentityOn:
          type: boolean
        sshRecorders:
          items:
            type: string
          type: array
        sshRecordingEnforce:
          type: boolean
        usersApprovalOn:
          description: Users created by OIDC login wait for an administrator before registering nodes.
          type: boolean
      required:
        - devicesApprovalOn
        - usersApprovalOn
        - postureIdentityOn
        - deviceAttributesOn
        - keyExpiryDays
        - defaultKeyExpiryDays
        - sshRecorders
        - sshRecordingEnforce
        - embeddedRecorder
      type: object
    ShareNodeRequestBody:
      additionalProperties: false
      properties:
        userId:
          description: ID of the user to share the node with.
          format: uint64
          type: string
      required:
        - userId
      type: object
    SshRecordingOutputBody:
      additionalProperties: false
      properties:
        recording:
          $ref: "#/components/schemas/SSHRecording"
      required:
        - recording
      type: object
    StartNodeClientUpdateRequestBody:
      additionalProperties: false
      properties:
        force:
          description: Update even while the node is serving SSH sessions.
          type: boolean
      type: object
    StartNodesClientUpdateRequestBody:
      additionalProperties: false
      properties:
        force:
          description: Update even while a node is serving SSH sessions.
          type: boolean
        nodeIds:
          description: The nodes to update.
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - nodeIds
      type: object
    TailnetLock:
      additionalProperties: false
      properties:
        disabledAt:
          description: Last switched off.
          format: date-time
          type: string
        enabled:
          description: Whether the lock is on.
          type: boolean
        enabledAt:
          description: Last switched on.
          format: date-time
          type: string
        head:
          description: The latest update while on.
          type: string
        keys:
          description: The trusted keys while on.
          items:
            $ref: "#/components/schemas/TailnetLockKey"
          type: array
        signedNodeIds:
          description: Nodes with a signature.
          items:
            type: string
          type: array
        supportDisablementAvailable:
          description: Whether the API can switch it off.
          type: boolean
        unsignedNodeIds:
          description: Nodes without one.
          items:
            type: string
          type: array
      required:
        - enabled
        - head
        - keys
        - supportDisablementAvailable
        - signedNodeIds
        - unsignedNodeIds
      type: object
    TailnetLockKey:
      additionalProperties: false
      properties:
        id:
          description: The key's identifier, hex.
          type: string
        public:
          description: "The public key in tlpub: form."
          type: string
        votes:
          description: The key's weight when the authority decides.
          format: int64
          minimum: 0
          type: integer
      required:
        - id
        - public
        - votes
      type: object
    UpdateNodePreferencesRequestBody:
      additionalProperties: false
      properties:
        acceptDns:
          type: boolean
        acceptRoutes:
          type: boolean
        advertiseConnector:
          type: boolean
        advertiseExitNode:
          type: boolean
        advertiseRoutes:
          items:
            type: string
          type: array
        autoUpdateApply:
          type: boolean
        autoUpdateCheck:
          type: boolean
        exitNode:
          description: A stable node id or address; empty clears it.
          type: string
        exitNodeAllowLanAccess:
          type: boolean
        hostname:
          type: string
        postureChecking:
          type: boolean
        runSsh:
          type: boolean
        shieldsUp:
          type: boolean
      type: object
    UpdateOAuthClientOutputBody:
      additionalProperties: false
      properties:
        oauthClient:
          $ref: "#/components/schemas/OAuthClient"
      required:
        - oauthClient
      type: object
    UpdateOAuthClientRequestBody:
      additionalProperties: false
      properties:
        audience:
          description: "Federated: the audience the JWT must carry."
          type: string
        customClaimRules:
          additionalProperties:
            type: string
          description: "Federated: replaces the rules; {} clears them."
          type: object
        description:
          type: string
        issuer:
          description: "Federated: the https URL of the OIDC issuer."
          type: string
        scopes:
          description: Replaces the scopes; at least one.
          items:
            type: string
          type: array
        subject:
          description: "Federated: the subject the JWT must equal."
          type: string
        tags:
          description: Replaces the tags; [] clears them.
          items:
            type: string
          type: array
      type: object
    UpdateServiceRequestBody:
      additionalProperties: false
      properties:
        comment:
          type: string
        displayName:
          type: string
        ports:
          items:
            type: string
          type: array
      type: object
    UpdateSettingsRequestBody:
      additionalProperties: false
      properties:
        deviceAttributesOn:
          type: boolean
        devicesApprovalOn:
          type: boolean
        keyExpiryDays:
          format: int64
          maximum: 365
          minimum: 0
          type: integer
        postureIdentityOn:
          type: boolean
        sshRecorders:
          items:
            type: string
          type: array
        sshRecordingEnforce:
          type: boolean
        usersApprovalOn:
          type: boolean
      type: object
    UpdateUserRequestBody:
      additionalProperties: false
      properties:
        displayName:
          description: The name shown in the clients in place of the username.
          type: string
        email:
          type: string
        pictureUrl:
          description: The URL of the profile picture shown in the clients.
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        approved:
          description: false while the user waits for an administrator.
          type: boolean
        approvedAt:
          format: date-time
          type:
            - string
            - "null"
        createdAt:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          type: string
        id:
          format: uint64
          type: string
        name:
          type: string
        profilePicUrl:
          type: string
        provider:
          type: string
        providerId:
          type: string
        role:
          description: owner, admin, network-admin, it-admin, auditor or member
          type: string
      required:
        - id
        - name
        - createdAt
        - displayName
        - email
        - providerId
        - provider
        - profilePicUrl
        - role
        - approved
        - approvedAt
      type: object
    UserOutputBody:
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
      type: object
    Webhook:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        createdByUserId:
          format: uint64
          type: string
        description:
          type: string
        id:
          format: uint64
          type: string
        lastDeliveryAt:
          format: date-time
          type:
            - string
            - "null"
        lastDeliveryStatus:
          type: string
        providerType:
          type: string
        secret:
          type: string
        subscriptions:
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
        url:
          type: string
      required:
        - id
        - url
        - description
        - providerType
        - subscriptions
        - createdByUserId
        - createdAt
        - updatedAt
        - lastDeliveryAt
        - lastDeliveryStatus
      type: object
    WebhookDeliveriesOutputBody:
      additionalProperties: false
      properties:
        deliveries:
          items:
            $ref: "#/components/schemas/WebhookDelivery"
          type: array
      required:
        - deliveries
      type: object
    WebhookDelivery:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        attempts:
          format: int64
          type: integer
        durationMs:
          format: int64
          type: integer
        eventType:
          type: string
        id:
          format: uint64
          type: string
        ok:
          type: boolean
        status:
          type: string
      required:
        - id
        - eventType
        - status
        - ok
        - attempts
        - durationMs
        - at
      type: object
    WebhookEventTypes:
      additionalProperties: false
      properties:
        types:
          items:
            type: string
          type: array
      required:
        - types
      type: object
    WebhookOutputBody:
      additionalProperties: false
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
      required:
        - webhook
      type: object
    WebhookRequestBody:
      additionalProperties: false
      properties:
        description:
          type: string
        providerType:
          enum:
            - ""
            - slack
            - mattermost
            - googlechat
            - discord
            - teams
            - telegram
            - ntfy
            - email
          type: string
        subscriptions:
          items:
            type: string
          type:
            - array
            - "null"
        url:
          type: string
      required:
        - url
        - subscriptions
      type: object
    WebhookTestOutputBody:
      additionalProperties: false
      properties:
        delivered:
          type: boolean
        status:
          description: HTTP status or the error text.
          type: string
      required:
        - delivered
        - status
      type: object
    Whoami:
      additionalProperties: false
      properties:
        allAccess:
          type: boolean
        kind:
          description: "How the caller authenticated: local, api_key, oauth or session."
          type: string
        permissions:
          additionalProperties:
            type: boolean
          type: object
        role:
          type: string
        scopes:
          items:
            type: string
          type: array
        user:
          $ref: "#/components/schemas/User"
      required:
        - kind
        - role
        - allAccess
        - scopes
        - permissions
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  description: Slopscale control server API.
  title: Slopscale API
  version: v1
openapi: 3.1.0
paths:
  /api/v1/access-graph:
    get:
      description: |-
        Who can reach what: one edge per ordered pair of machines the packet filter or the SSH policy opens, computed from the rules the server hands each machine.

        Requires the `policy_file:read` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: getAccessGraph
      parameters:
        - description: A node id; only edges from or to it.
          explode: false
          in: query
          name: node
          schema:
            description: A node id; only edges from or to it.
            format: uint64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGraph"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Access graph
      tags:
        - Access control
      x-required-scope: policy_file:read
  /api/v1/access-request:
    get:
      description: Every request, newest first, for a caller with policy_file:read; a caller without it sees its own.
      operationId: listAccessRequests
      parameters:
        - description: Only requests in this status.
          explode: false
          in: query
          name: status
          schema:
            description: Only requests in this status.
            type: string
        - description: Only the caller's own requests, whatever the scope.
          explode: false
          in: query
          name: mine
          schema:
            description: Only the caller's own requests, whatever the scope.
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRequestsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List access requests
      tags:
        - Access control
    post:
      description: Files the caller's ask to join a requestable group for a while, for one of their machines or for every machine they own. The credential must belong to a user.
      operationId: createAccessRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Request access
      tags:
        - Access control
      x-audit-action: access_request.create
  /api/v1/access-request/options:
    get:
      description: The groups that take access requests and the caller's own machines. Any authenticated caller may ask; a credential without a user gets no machines.
      operationId: listAccessRequestOptions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOptionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: What the caller may request
      tags:
        - Access control
  /api/v1/access-request/{id}:
    delete:
      description: The requester withdraws a pending request. A caller with policy_file withdraws any pending request, or deletes a decided one from the record.
      operationId: cancelAccessRequest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Cancel or delete access request
      tags:
        - Access control
      x-audit-action: access_request.cancel
    get:
      operationId: getAccessRequest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get access request
      tags:
        - Access control
  /api/v1/access-request/{id}/approve:
    post:
      description: |-
        Adds the membership for the requested duration, or the one given, and rebuilds the policy. Nobody approves their own request.

        Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: approveAccessRequest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecisionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Approve access request
      tags:
        - Access control
      x-audit-action: access_request.approve
      x-required-scope: policy_file
  /api/v1/access-request/{id}/deny:
    post:
      description: Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: denyAccessRequest
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessDecisionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Deny access request
      tags:
        - Access control
      x-audit-action: access_request.deny
      x-required-scope: policy_file
  /api/v1/access-rule:
    get:
      description: Requires the `policy_file:read` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: listAccessRules
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRulesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List access rules
      tags:
        - Access control
      x-required-scope: policy_file:read
    post:
      description: |-
        Lets the source groups reach the destination groups on the protocol and ports. Rules only allow: once one is enabled, or the policy file has rules, everything not allowed is denied.

        Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: createAccessRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRuleRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Create access rule
      tags:
        - Access control
      x-audit-action: access_rule.create
      x-required-scope: policy_file
  /api/v1/access-rule/{id}:
    delete:
      description: Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: deleteAccessRule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Delete access rule
      tags:
        - Access control
      x-audit-action: access_rule.delete
      x-required-scope: policy_file
    get:
      description: Requires the `policy_file:read` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: getAccessRule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get access rule
      tags:
        - Access control
      x-required-scope: policy_file:read
    patch:
      description: |-
        Changes only the switch; the rest of the rule is read from the server, not the request.

        Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: setAccessRuleEnabled
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleEnabledInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Enable or disable access rule
      tags:
        - Access control
      x-audit-action: access_rule.update
      x-required-scope: policy_file
    put:
      description: Requires the `policy_file` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: updateAccessRule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uint64
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRuleRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Replace access rule
      tags:
        - Access control
      x-audit-action: access_rule.update
      x-required-scope: policy_file
  /api/v1/apikey:
    get:
      operationId: listApiKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIKeysOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List API keys
      tags:
        - ApiKeys
    post:
      description: Any authenticated caller may mint a key for itself; a key for another user, or a legacy key without a user, needs the owner, an admin or the socket.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
