  /api/v1/audit:
    get:
      description: |-
        Newest first. Every writing API request and the server's own sign-in events are recorded; page with before=<last id>.

        Requires the `logs:configuration:read` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: listAuditEvents
      parameters:
        - description: Keep events by this user.
          explode: false
          in: query
          name: actorUserId
          schema:
            description: Keep events by this user.
            type: string
        - description: "An action prefix: node. keeps every node action."
          explode: false
          in: query
          name: action
          schema:
            description: "An action prefix: node. keeps every node action."
            type: string
        - explode: false
          in: query
          name: targetKind
          schema:
            type: string
        - explode: false
          in: query
          name: targetId
          schema:
            type: string
        - description: RFC 3339; events at or after this time.
          explode: false
          in: query
          name: since
          schema:
            description: RFC 3339; events at or after this time.
            format: date-time
            type: string
        - description: RFC 3339; events before this time.
          explode: false
          in: query
          name: until
          schema:
            description: RFC 3339; events before this time.
            format: date-time
            type: string
        - description: "Page: events with an ID below this one."
          explode: false
          in: query
          name: before
          schema:
            description: "Page: events with an ID below this one."
            format: uint64
            type: string
        - description: Page size, at most 500.
          explode: false
          in: query
          name: limit
          schema:
            description: Page size, at most 500.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List audit events
      tags:
        - Audit
      x-required-scope: logs:configuration:read
  /api/v1/audit/export:
    get:
      description: |-
        The events matching the same filters as the list, oldest first, as a file download. At most 100000 events: when more match, the export stops there and the newest are left out, so narrow since and until to reach them.

        Requires the `logs:configuration:read` scope (granted by an OAuth token's scopes or the API key owner's role; a legacy API key without a user is all-access).
      operationId: exportAuditEvents
      parameters:
        - description: Keep events by this user.
          explode: false
          in: query
          name: actorUserId
          schema:
            description: Keep events by this user.
            type: string
        - description: "An action prefix: node. keeps every node action."
          explode: false
          in: query
          name: action
          schema:
            description: "An action prefix: node. keeps every node action."
            type: string
        - explode: false
          in: query
          name: targetKind
          schema:
            type: string
        - explode: false
          in: query
          name: targetId
          schema:
            type: string
        - description: RFC 3339; events at or after this time.
          explode: false
          in: query
          name: since
          schema:
            description: RFC 3339; events at or after this time.
            format: date-time
            type: string
        - description: RFC 3339; events before this time.
          explode: false
          in: query
          name: until
          schema:
            description: RFC 3339; events before this time.
            format: date-time
            type: string
        - description: "Page: events with an ID below this one."
          explode: false
          in: query
          name: before
          schema:
            description: "Page: events with an ID below this one."
            format: uint64
            type: string
        - description: File format, csv by default.
          explode: false
          in: query
          name: format
          schema:
            description: File format, csv by default.
            enum:
              - csv
              - json
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            text/csv:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The events as a file.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Export audit events
      tags:
        - Audit
      x-required-scope: logs:configuration:read
