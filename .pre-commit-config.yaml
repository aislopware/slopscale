# prek/pre-commit configuration for headscale
# See: https://prek.j178.dev/quickstart/
# See: https://prek.j178.dev/builtin/

# Global exclusions - ignore generated code (proto output and emitted OpenAPI)
# and recorded golden fixtures.
exclude: ^(gen|openapi)/|^hscontrol/testdata/apiv1_golden/

repos:
  # Built-in hooks from pre-commit/pre-commit-hooks
  # prek will use fast-path optimized versions automatically
  # See: https://prek.j178.dev/builtin/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Local hooks for project-specific tooling
  - repo: local
    hooks:
      # nixpkgs-fmt for Nix files
      - id: nixpkgs-fmt
        name: nixpkgs-fmt
        entry: nixpkgs-fmt
        language: system
        files: \.nix$

      # oxfmt for the repo's markup and config files, from the console's
      # pinned toolchain (make web-deps installs it); .oxfmtrc.json at the
      # root scopes it. Once per commit: prek batches files across
      # processes, which would otherwise install concurrently.
      - id: oxfmt
        name: oxfmt
        entry: make --silent fmt-markup
        language: system
        exclude: ^(docs|web|\.claude)/
        types_or:
          [javascript, jsx, ts, tsx, yaml, html, css, scss, sass, markdown]
        pass_filenames: false

      # The admin console has its own toolchain (oxfmt, oxlint, tsc); run it
      # once per commit that touches web/ instead of per file.
      - id: web-check
        name: web check
        entry: bash -c 'cd web && bun install --frozen-lockfile --silent && bun run typecheck && bun run lint && bun run fmt:check'
        language: system
        files: ^web/
        pass_filenames: false

      # mdformat for docs
      - id: mdformat
        name: mdformat
        entry: mdformat
        language: system
        types_or: [markdown]
        files: ^docs/

      # go fix applies the Go release modernizers (any, min/max, range-int,
      # slices/maps, strings.SplitSeq, wg.Go, ...) so new code never lands
      # in an old idiom.
      - id: go-fix
        name: go fix
        entry: go fix ./...
        language: system
        types: [go]
        pass_filenames: false

      # golangci-lint for Go code quality; --fix also runs the formatters
      # (gci, gofumpt, goimports, golines).
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --new-from-rev=HEAD~1 --timeout=5m --fix
        language: system
        types: [go]
        pass_filenames: false

      # go.mod/go.sum must be tidy; a stale graph hides unused or missing
      # requirements from govulncheck and the Nix vendor hash.
      - id: go-mod-tidy
        name: go mod tidy -diff
        entry: go mod tidy -diff
        language: system
        files: ^(go\.mod|go\.sum)$
        pass_filenames: false

      # vendor-hash keeps flakehashes.json in sync with go.mod/go.sum.
      - id: vendor-hash
        name: vendor-hash
        entry: nix develop --command -- go run ./cmd/vendorhash check
        language: system
        files: ^(go\.mod|go\.sum|flakehashes\.json)$
        pass_filenames: false
