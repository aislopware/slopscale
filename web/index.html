<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Kumo's colours key on data-mode, which src/lib/theme.ts sets from the stored choice. That
      module runs after the bundle loads, so without this the first paint is light and a dark
      console flashes white on every reload. The server hashes this script into the console's
      Content-Security-Policy; keep it in step with theme.ts.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("slopscale-admin.theme");
          const dark =
            stored === "dark" ||
            (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.mode = dark ? "dark" : "light";
        } catch {
          /* no storage, the module picks it up */
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <title>__SLOPSCALE_BRAND__</title>
    <meta name="description" content="__SLOPSCALE_DESCRIPTION__" />
    <!--
      The server fills __SLOPSCALE_URL__ with its own address, __SLOPSCALE_BRAND__ with the
      configured product name and __SLOPSCALE_DESCRIPTION__ with the configured description when it
      serves this file. The card between the markers below is drawn with the product's own mark, so
      the server replaces it with the operator's own card, or drops it where they configured none,
      rather than unfurling somebody else's picture.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SLOPSCALE_BRAND__" />
    <meta property="og:title" content="__SLOPSCALE_BRAND__ admin console" />
    <meta property="og:description" content="__SLOPSCALE_DESCRIPTION__" />
    <meta property="og:url" content="__SLOPSCALE_URL__/console/" />
    <!--card-->
    <meta property="og:image" content="__SLOPSCALE_URL__/opengraph.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The slopscale mark and name" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SLOPSCALE_BRAND__ admin console" />
    <meta name="twitter:description" content="__SLOPSCALE_DESCRIPTION__" />
    <meta name="twitter:image" content="__SLOPSCALE_URL__/opengraph.png" />
    <!--/card-->
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
