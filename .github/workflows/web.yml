name: Admin console

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "gen/openapi/**"
      - "hscontrol/api/**"
      - "cmd/dev/**"
      - "*.nix"
      - "flake.lock"
      - ".github/workflows/web.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "web/**"
      - "gen/openapi/**"
      - "hscontrol/api/**"
      - "cmd/dev/**"
      - "*.nix"
      - "flake.lock"
      - ".github/workflows/web.yml"
      - ".github/actions/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

jobs:
  # Two runners, alike in length: the static checks and the generated types
  # on one, the build and every test on the other. In one job the steps ran
  # in series and a console change waited about three minutes for its
  # answer; split, it waits for the longer half.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go-key: web
          bun: "true"

      - name: Typecheck, lint and format
        run: make lint-web

      # The OpenAPI generator compiles most of the server, so this job needs
      # the Go cache as much as the tests do.
      - name: Check generated API types
        run: |
          make web-generate
          if ! git diff --exit-code -- gen/openapi web/src/api web/src/lib/hujson; then
            echo "Console API types or the HuJSON parser are not up to date; run 'make web-generate' and commit."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go-key: web
          bun: "true"
          playwright: "true"

      - name: Build
        run: make web

      - name: Browser tests
        run: |
          cd web && bunx playwright install --with-deps chromium
          make -C .. test-web

      - name: Embedded console tests
        run: go test ./web/

      - name: End-to-end sign-in
        run: make test-e2e
