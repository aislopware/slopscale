name: Nix

# The sandboxed checks: `nix build .#checks.x86_64-linux.<name>`, with the
# logic in flake.nix. hestia serves a check from its cache when the fileset
# is unchanged, so a docs-only push costs seconds. The NixOS module test
# reuses the package the build job just made and runs only when the module,
# the flake or its lock changed.

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - "!docs/**"
      - "!.claude/**"
      - "!web/**"
      - "web/*.go"
      - "web/unbuilt.html"
      - "web/dist/**"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!.claude/**"
      - "!web/**"
      - "web/*.go"
      - "web/unbuilt.html"
      - "web/dist/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: nix build
        run: nix build -L --fallback .#checks.x86_64-linux.build

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - name: Nix files
        run: nix build -L --fallback .#checks.x86_64-linux.formatting
      # oxfmt comes from web/bun.lock, which the sandboxed check cannot
      # fetch, so the markup and config files are checked here instead.
      - name: Markup and config files
        run: nix develop --fallback --command make lint-markup

  module:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Changed files
        id: changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            nix:
              - "nix/**"
              - "flake.nix"
              - "flake.lock"
              - "flakehashes.json"
              - ".github/workflows/nix-checks.yml"
      - uses: ./.github/actions/setup
        if: steps.changed.outputs.nix == 'true'
      - name: NixOS module test
        if: steps.changed.outputs.nix == 'true'
        run: nix build -L --fallback .#checks.x86_64-linux.slopscale
