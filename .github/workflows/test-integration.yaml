name: integration
# To debug locally on a branch, and when needing secrets
# change this to include `push` so the build is ran on
# the main repository.
on:
  pull_request:
  # The soak test's full window only runs here: a pull request shortens it,
  # because that one job is what bounds the matrix's wall clock.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}
jobs:
  # build: Builds binaries and Docker images once, uploads as artifacts for reuse.
  # build-postgres: Pulls postgres image separately to avoid Docker Hub rate limits.
  # build-tailscale-released: Pre-pulls released Tailscale images from ghcr.io
  # so fork PRs (no DOCKERHUB_USERNAME secret) don't hit Docker Hub rate
  # limits at test time.
  # sqlite: Runs all integration tests with SQLite backend.
  # postgres: Runs a subset of tests with PostgreSQL to verify database compatibility.
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      files-changed: ${{ steps.changed-files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            files:
              - '*.nix'
              - 'go.*'
              - '**/*.go'
              - 'integration/**'
              - 'config-example.yaml'
              - '.github/workflows/test-integration.yaml'
              - '.github/workflows/integration-test-template.yml'
              - 'Dockerfile.*'
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        if: steps.changed-files.outputs.files == 'true'
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        if: steps.changed-files.outputs.files == 'true'
      # The matrix waits on this job, so its length is added to every run's
      # wall clock. Compiling from cold was the bulk of it.
      - name: Restore Go cache
        if: steps.changed-files.outputs.files == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-integration-${{ runner.os }}-${{ runner.arch }}-
      - name: Build binaries and warm Go cache
        if: steps.changed-files.outputs.files == 'true'
        run: |
          # Build all Go binaries in one nix shell to maximize cache reuse.
          # hi runs on a runner that has no nix store, so it must not be the
          # dynamically linked binary the dev shell's C compiler produces by
          # default: its interpreter would be missing and exec fails with 127.
          CGO_ENABLED=0 go build -o hi ./cmd/hi
          # The container runs the binary on Debian; zigcc links it statically against musl.
          CC=zigcc GOOS=linux go build -trimpath -tags netgo,osusergo -ldflags '-linkmode=external -extldflags=-static' -o slopscale ./cmd/slopscale
          # Build integration test binary to warm the cache with all dependencies
          go test -c ./integration -o /dev/null 2>/dev/null || true
      - name: Upload hi binary
        if: steps.changed-files.outputs.files == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hi-binary
          path: hi
          retention-days: 10
      - name: Package Go cache
        if: steps.changed-files.outputs.files == 'true'
        run: |
          # Package Go module cache and build cache. gzip -1 rather than the
          # default -6: this runs on the critical path before the matrix can
          # start, while the slightly larger artifact is downloaded by the
          # test jobs in parallel.
          tar -I 'gzip -1' -cf go-cache.tar.gz -C ~ go .cache/go-build
      - name: Upload Go cache
        if: steps.changed-files.outputs.files == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-cache
          path: go-cache.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
      - name: Force overlay2 storage driver
        if: steps.changed-files.outputs.files == 'true'
        run: |
          # Docker 29 runner images default to overlayfs, which breaks
          # docker build via Go SDK libraries and docker save/load
          # tarball formats. overlay2 is the long-standing default.
          # https://github.com/actions/runner-images/issues/13474
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build slopscale image
        if: steps.changed-files.outputs.files == 'true'
        run: |
          docker build \
            --file Dockerfile.integration-ci \
            --tag slopscale:${{ github.sha }} \
            .
          docker save slopscale:${{ github.sha }} | gzip > slopscale-image.tar.gz
      - name: Build tailscale HEAD image
        if: steps.changed-files.outputs.files == 'true'
        run: |
          docker build \
            --file Dockerfile.tailscale-HEAD \
            --tag tailscale-head:${{ github.sha }} \
            .
          docker save tailscale-head:${{ github.sha }} | gzip > tailscale-head-image.tar.gz
      - name: Upload slopscale image
        if: steps.changed-files.outputs.files == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slopscale-image
          path: slopscale-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
      - name: Upload tailscale HEAD image
        if: steps.changed-files.outputs.files == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailscale-head-image
          path: tailscale-head-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  build-postgres:
    runs-on: ubuntu-24.04-arm
    needs: build
    if: needs.build.outputs.files-changed == 'true'
    steps:
      - name: Force overlay2 storage driver
        shell: bash
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Pull and save postgres image
        shell: bash
        run: |
          docker pull postgres:latest
          docker tag postgres:latest postgres:${{ github.sha }}
          docker save postgres:${{ github.sha }} | gzip > postgres-image.tar.gz
      - name: Upload postgres image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-image
          path: postgres-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  build-tailscale-released:
    runs-on: ubuntu-24.04-arm
    needs: build
    if: needs.build.outputs.files-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      - name: Force overlay2 storage driver
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: List Tailscale versions to pre-pull
        id: versions
        run: |
          versions=$(go run ./cmd/hi list-versions --set=must --exclude=head)
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "Pre-pulling: ${versions}"
      - name: Pull Tailscale images
        run: |
          # Releases come from ghcr.io (anonymous, unmetered). The
          # "unstable" floating tag on ghcr.io has been stale since 2022,
          # so it still needs to come from Docker Hub. xargs -P 0 fans
          # out one process per tag and returns non-zero if any pull
          # fails.
          refs=""
          for v in ${{ steps.versions.outputs.versions }}; do
            if [ "${v}" = "unstable" ]; then
              refs="${refs} tailscale/tailscale:${v}"
            else
              refs="${refs} ghcr.io/tailscale/tailscale:${v}"
            fi
          done
          echo "${refs}" | tr ' ' '\n' | grep -v '^$' \
            | xargs -P 0 -I{} docker pull "{}"
          echo "REFS=${refs}" >> "$GITHUB_ENV"
      - name: Save Tailscale images to tarball
        run: |
          # Single docker save with all refs: one consistent snapshot, no
          # parallel-daemon race.
          docker save ${REFS} | gzip > tailscale-released-images.tar.gz
          ls -lh tailscale-released-images.tar.gz
      - name: Upload Tailscale released images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailscale-released-images
          path: tailscale-released-images.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  sqlite:
    needs: [build, build-tailscale-released]
    if: needs.build.outputs.files-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "01"
            tests: "^(TestAPIAuthenticationBypass|TestDisableNodeExpiry|TestNodeOnlineStatus|TestPingAllByIPManyUpDown|TestRemoteCLIAuthenticationBypass|TestSSHOneUserToOneCheckModeCLI|TestSSHUserOnlyIsolation|TestTagsUserLoginUnownedTagAtRegistration)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-false-pol-file).*$"
          - name: "02"
            tests: "^(TestExitRoutesWithAutogroupInternetACL|TestNodeTagCommand|TestOIDCExpireNodesBasedOnTokenExpiry|TestPolicyCheckCommand|TestServerInfoCommands|TestTagsAuthKeyWithTagCLICannotModifyAdminTags|TestTagsReauthDifferentKeyRetagsNode|TestTagsUserLoginNonExistentTagAtRegistration)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-true-pol-database).*$ ^TestOIDC024UserCreation$/^(migration-no-strip-domains-not-verified-email).*$"
          - name: "03"
            tests: "^(TestACLDynamicUnknownUserRemoval|TestACLTagPropagation|TestPreAuthKeyCommandValidation|TestSSHNoSSHConfigured|TestTS2021WASMClientUnderNode|TestTS2021WebSocketGET|TestTagsAdminAPICannotSetNonExistentTag|TestUserCreateCommand)$ ^TestAuthKeyLogoutAndReloginSameUser$/^(with-https-true).*$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-true-pol-file).*$"
          - name: "04"
            tests: "^(TestACLAllowUser80Dst|TestACLDynamicUnknownUserAddition|TestAuthCommandValidation|TestAuthKeyDeleteKey|TestHASubnetRouterFailoverDockerDisconnect|TestPolicyUpdateWhileRunningWithCLIInDatabase|TestTagsAuthKeyWithoutTagRegisterNoTags|TestTagsUserLoginRemoveTagViaCLIReauth)$ ^TestAuthKeyLogoutAndReloginSameUser$/^(with-https-false).*$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-false-pol-database).*$"
          - name: "05"
            tests: "^(TestACLAllowUserDst|TestACLAutogroupTagged|TestApiKeyCommandValidation|TestAuthWebFlowLogoutAndReloginNewUser|TestAuthWebFlowLogoutAndReloginSameUser|TestResolveMagicDNS|TestSSHAutogroupSelf|TestTagsAdminAPICanSetUnownedTag|TestTagsUserLoginReauthWithEmptyTagsRemovesAllTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-false-pol-database).*$"
          - name: "06"
            tests: "^(TestACLPolicyPropagationOverTime|TestDERPVerifyEndpoint|TestEnablingExitRoutes|TestPolicyBrokenConfigCommand|TestSSHTestsRejectFailingPolicy|TestSubnetRouteACLFiltering|TestTagsAuthKeyWithoutTagCLINoOpAfterAdminWithEmptyAdvertise|TestTagsAuthKeyWithoutTagCannotRequestTags|TestTagsReauthDifferentKeyRemovesTag)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-false-pol-file).*$"
          - name: "07"
            tests: "^(TestCLIWithConfigAuthenticationBypass|TestDERPServerWebsocketScenario|TestEphemeral2006DeletedTooQuickly|TestNodeBackfillIPsCommand|TestSSHCheckModeCheckPeriodCLI|TestTaggedNodeLogoutReloginSingleUseKeyOnline|TestTagsAdminAPICannotSetInvalidFormat|TestTagsAuthKeyWithTagNoAdvertiseFlag|TestTagsAuthKeyWithTagRequestNonExistentTag)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-true-pol-database).*$"
          - name: "08"
            tests: "^(TestACLHostsInNetMapTable|TestACLNamedHostsCanReach|TestOIDCFollowUpUrl|TestPingAllByHostname|TestPingAllByIP|TestSSHIsBlockedInACL|TestSlopscale|TestTagsAdminAPICannotRemoveAllTags|TestTagsAuthKeyWithoutUserRejectsAdvertisedTags|TestUserCommand)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-true-pol-database).*$"
          - name: "09"
            tests: "^(TestAPIAuthenticationBypassCurl|TestApiKeyCommand|TestAuthKeyLogoutAndReloginRoutesPreserved|TestDERPServerScenario|TestOIDCReloginSameNodeNewUser|TestPolicyCommand|TestPreAuthKeyCorrectUserLoggedInCommand|TestTagsReauthEmptyTagsReturnsToUserSurvives|TestTagsUserLoginAddTagViaCLIReauth)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-true-pol-file).*$"
          - name: "10"
            tests: "^(TestACLGroupDeletionExactReproduction|TestACLGroupWithUnknownUser|TestAuthWebFlowAuthenticationPingAll|TestNodeCommand|TestResolveMagicDNSExtraRecordsPath|TestSSHCheckModeUnapprovedTimeout|TestSubnetRouterMultiNetworkExitNode|TestTagsOIDCReauthAddOwnedTag|TestTagsUserLoginCLICannotRemoveAdminTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-false-pol-file).*$"
          - name: "11"
            tests: "^(TestACLDevice1CanAccessDevice2|TestGrantViaSubnetSteering|TestNodeCommandValidation|TestNodeRouteCommands|TestOAuthClientCommandValidation|TestTagsAuthKeyWithoutUserInheritsTags|TestTagsUserLoginCLINoOpAfterAdminAssignment|TestTailscaleRustAxum)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-false-pol-database|webauth-user-advertiseduringup-true-pol-file).*$"
          - name: "12"
            tests: "^(TestExpireNode|TestHASubnetRouterPingFailover|TestPreAuthKeyCommandReusableEphemeral|TestPreAuthKeyCommandWithoutExpiry|TestPreAuthKeyDeleteCommand|TestSSHOneUserToOneCheckModeOIDC|TestSetNodeExpiryInFuture|TestTaildrop)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-true-pol-file|webauth-user-advertiseduringup-true-pol-database).*$"
          - name: "13"
            tests: "^(Test2118DeletingOnlineNodePanics|TestHASubnetRouterFailoverBothOfflineCablePull|TestOIDCACLPolicyOnJoin|TestSSHCheckModeAutoApprove|TestTaggedNodeLogoutReloginReusableKeyOnline|TestTagsAuthKeyWithoutTagCLICannotReduceAdminMultiTag|TestTailscaleNodesJoiningHeadcale|TestUpdateHostnameFromClient)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-true-pol-file).*$ ^TestOIDC024UserCreation$/^(no-migration-not-verified-email).*$ ^TestSSHLocalpart$/^(AutogroupSelf).*$"
          - name: "14"
            tests: "^(TestACLTagPropagationPortSpecific|TestOIDCMultipleOpenedLoginUrls|TestSubnetRouterMultiNetwork|TestTagsAuthKeyConvertToUserViaCLIRegister|TestTagsAuthKeyWithTagAdminOverrideReauthPreserves|TestTagsAuthKeyWithTagCannotAddViaCLI|TestTagsIssue2978ReproTagReplacement|TestTagsUserLoginOwnedTagAtRegistration)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-false-pol-file).*$ ^TestSSHLocalpart$/^(MemberAndTagged).*$"
          - name: "15"
            tests: "^(TestACLDenyAllPort80|TestEphemeral|TestNodeExpireFlagsCommand|TestOIDCAuthenticationPingAll|TestSSHCheckModeNegativeCLI|TestSSHOneUserToAll|TestTagsAuthKeyWithTagRequestDifferentTag|TestTagsAuthKeyWithoutTagCannotAddViaCLI)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-true-pol-database|webauth-user-advertiseduringup-false-pol-file).*$"
          - name: "16"
            tests: "^(TestACLAllowStarDst|TestACLNamedHostsCanReachBySubnet|TestEphemeralInAlternateTimezone|TestOIDCAuthenticationWithPKCE|TestOIDCReloginSameUserRoutesPreserved|TestSSHMultipleUsersAllToAll|TestTagsAuthKeyWithoutTagRequestNonExistentTag)$ ^TestAutoApproveMultiNetwork$/^(webauth-user-advertiseduringup-false-pol-database).*$ ^TestOIDC024UserCreation$/^(no-migration-verified-email).*$ ^TestSSHLocalpart$/^(LocalpartPlusRoot).*$"
          - name: "17"
            tests: "^(TestACLAutogroupMember|TestACLAutogroupSelf|TestHASubnetRouterFailoverBothOffline|TestK8sOperator|TestOAuthClientCommand|TestPingAllByIPPublicDERP|TestTaggedNodesCLIOutput|TestTagsAuthKeyWithoutTagRequestUnownedTag)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-false-pol-database|webauth-tag-advertiseduringup-true-pol-database).*$"
          - name: "18"
            tests: "^(TestACLGroupAfterUserDeletion|TestAuthKeyLogoutAndReloginNewUser|TestOIDCExpiryAfterRestart|TestOIDCReloginSameNodeSameUser|TestPreAuthKeyCommand|TestSSHCheckModeSessionLossReDelegates|TestSubnetRouteACL|TestTagsAuthKeyWithTagRequestUnownedTag|TestUserCommandValidation)$ ^TestAuthKeyLogoutAndReloginSameUserExpiredKey$/^(with-https-false).*$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-false-pol-database).*$"
          - name: "19"
            tests: "^(TestEnablingRoutes|TestGrantCapDrive|TestGrantCapRelay|TestHASubnetRouterFailover|TestNodeExpireCommand|TestNodeRenameCommand|TestTagsAuthKeyWithTagCannotChangeViaCLI|TestTagsAuthKeyWithoutTagCLINoOpAfterAdminWithReset)$ ^TestAuthKeyLogoutAndReloginSameUserExpiredKey$/^(with-https-true).*$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-false-pol-file|webauth-tag-advertiseduringup-true-pol-file).*$"
    uses: ./.github/workflows/integration-test-template.yml
    secrets: inherit
    with:
      shard: ${{ matrix.shard.name }}
      tests: ${{ matrix.shard.tests }}
      database_name: "sqlite"
      # A pull request shortens the soak window; the nightly run keeps it.
      soak_duration: ${{ github.event_name == 'pull_request' && '4m' || '' }}
  postgres:
    needs: [build, build-postgres, build-tailscale-released]
    if: needs.build.outputs.files-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "01"
            tests: "^(TestACLAllowUserDst|TestEphemeral2006DeletedTooQuickly|TestPingAllByIP|TestPingAllByIPManyUpDown|TestSubnetRouterMultiNetwork)$"
    uses: ./.github/workflows/integration-test-template.yml
    secrets: inherit
    with:
      shard: ${{ matrix.shard.name }}
      tests: ${{ matrix.shard.tests }}
      postgres_flag: "--postgres=1"
      database_name: "postgres"
      # A pull request shortens the soak window; the nightly run keeps it.
      soak_duration: ${{ github.event_name == 'pull_request' && '4m' || '' }}
tests: null
