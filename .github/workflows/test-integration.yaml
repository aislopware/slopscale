name: integration
# To debug locally on a branch, and when needing secrets
# change this to include `push` so the build is ran on
# the main repository.
on:
  pull_request:
  # The soak test's full window only runs here: a pull request shortens it,
  # because that one job is what bounds the matrix's wall clock.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}
jobs:
  # build: Builds binaries and Docker images once, uploads as artifacts for reuse.
  # build-postgres: Pulls postgres image separately to avoid Docker Hub rate limits.
  # build-tailscale-released: Pre-pulls released Tailscale images from ghcr.io
  # so fork PRs (no DOCKERHUB_USERNAME secret) don't hit Docker Hub rate
  # limits at test time.
  # sqlite: Runs all integration tests with SQLite backend.
  # postgres: Runs a subset of tests with PostgreSQL to verify database compatibility.
  # Deciding whether the matrix has anything to do is a checkout and a filter,
  # so it is its own job. The image jobs below need the answer but none of
  # build's artifacts, and hanging them off build made them wait out its five
  # minutes for a value that was ready in twenty seconds.
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      files-changed: ${{ steps.changed-files.outputs.files }}
      fingerprint: ${{ steps.fingerprint.outputs.hash }}
      already-green: ${{ steps.green.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            files:
              - '*.nix'
              - 'go.*'
              - '**/*.go'
              - 'integration/**'
              - 'config-example.yaml'
              - '.github/workflows/test-integration.yaml'
              - '.github/workflows/integration-test-template.yml'
              - 'Dockerfile.*'
      # The filter above answers "does this pull request touch anything the
      # matrix tests", which on a pull_request event is asked of the whole
      # branch: GitHub gives paths-filter the base branch to diff against,
      # not the commit that was just pushed, and paths/paths-ignore on the
      # trigger behave the same way. So a pull request that changed one Go
      # file runs the matrix again for a later commit that only touched the
      # changelog. There is no filter setting that fixes this.
      #
      # What does fix it is asking a different question: has this exact tree
      # already passed. Every fully green run writes a marker under the
      # fingerprint of the files the matrix reads, and finding one here
      # skips the matrix. Rewriting a commit, or merging a main that moves
      # under the branch, changes the fingerprint and tests again.
      #
      # The trade is that a tree is tested once. A rerun of an unchanged
      # tree can only catch a flake, and catching flakes by lottery is not
      # what this gate is for.
      - name: Fingerprint what the matrix reads
        id: fingerprint
        shell: bash
        run: |
          echo "hash=${{ hashFiles(
            '*.nix',
            'go.*',
            '**/*.go',
            'integration/**',
            'config-example.yaml',
            '.github/workflows/test-integration.yaml',
            '.github/workflows/integration-test-template.yml',
            'Dockerfile.*'
          ) }}" >> "$GITHUB_OUTPUT"
      - name: Has this tree already passed
        id: green
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # lookup-only, so this reads the marker's existence without
          # downloading it. The marker is a timestamp; only its key matters.
          lookup-only: true
          path: .integration-green
          key: integration-green-${{ steps.fingerprint.outputs.hash }}
  build:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true' && needs.changes.outputs.already-green != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      - name: Force overlay2 storage driver
        run: |
          # Docker 29 runner images default to overlayfs, which breaks
          # docker build via Go SDK libraries and docker save/load
          # tarball formats. overlay2 is the long-standing default.
          # https://github.com/actions/runner-images/issues/13474
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      # The matrix waits on this job, so its length is added to every run's
      # wall clock. Compiling from cold was the bulk of it.
      - name: Restore Go cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/int-cache/go-build
            ~/go/pkg/mod
          # No ${{ github.sha }} in the key. With one the primary key never
          # repeats, so every run wrote another 665 MB entry, and the repo's
          # ten gigabyte cache budget then evicted them faster than the next
          # run could read one: measured "Cache not found for input keys" on
          # three consecutive runs, each paying four minutes to compile from
          # cold. Keyed on go.sum alone the primary key hits and actions/cache
          # skips the save entirely. What ages out of it is the handful of
          # first-party packages that changed, which cost seconds; the
          # dependency tree is what takes the four minutes and go.sum already
          # covers it.
          key: go-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-integration-${{ runner.os }}-${{ runner.arch }}-
      - name: Build binaries and warm Go cache
        run: |
          # Build all Go binaries in one nix shell to maximize cache reuse.
          # hi runs on a runner that has no nix store, so it must not be the
          # dynamically linked binary the dev shell's C compiler produces by
          # default: its interpreter would be missing and exec fails with 127.
          CGO_ENABLED=0 go build -o hi ./cmd/hi
          # The container runs the binary on Debian; zigcc links it statically against musl.
          CC=zigcc GOOS=linux go build -trimpath -tags netgo,osusergo -ldflags '-linkmode=external -extldflags=-static' -o slopscale ./cmd/slopscale
          # Warm the build cache for the integration tests, in the same image
          # `hi` runs them in and against the same mount points. Warming it
          # with the dev shell's Go was useless: a build cache key covers the
          # compiler that produced it, and nix's toolchain is not the golang
          # image's, so every shard missed and spent four minutes compiling
          # from cold on the first pattern of each of its streams.
          go_version=$(sed -n 's/^go \([0-9.]*\).*/\1/p' go.mod | head -1)
          # Its own directory rather than the dev shell's: the two toolchains
          # cannot read each other's entries anyway, and putting both in one
          # tarball tripled what every shard downloads.
          mkdir -p "$HOME/int-cache/go-build"
          # As the runner rather than root, so the tar below can still read
          # what it writes. GOPATH is /go in the image, which is where the
          # module cache is mounted; HOME only has to exist and be writable.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" \
            --volume "$HOME/go:/go" \
            --volume "$HOME/int-cache/go-build:/cache/go-build" \
            --env GOCACHE=/cache/go-build \
            --env HOME=/tmp \
            --workdir "$PWD/integration" \
            "golang:${go_version}" \
            go test -c . -o /dev/null
      - name: Upload hi binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hi-binary
          path: hi
          retention-days: 10
      - name: Package Go cache
        run: |
          # Package Go module cache and build cache. gzip -1 rather than the
          # default -6: this runs on the critical path before the matrix can
          # start, while the slightly larger artifact is downloaded by the
          # test jobs in parallel.
          tar -I 'gzip -1' -cf go-cache.tar.gz -C ~ go -C ~/int-cache go-build
      - name: Upload Go cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-cache
          path: go-cache.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
      - name: Build slopscale image
        run: |
          docker build \
            --file Dockerfile.integration-ci \
            --tag slopscale:${{ github.sha }} \
            .
          docker save slopscale:${{ github.sha }} | gzip > slopscale-image.tar.gz
      - name: Upload slopscale image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slopscale-image
          path: slopscale-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  # Two minutes of docker build that needs nothing from `build`. Its steps run
  # as plain bash rather than through the dev shell, so it skips installing nix
  # for a job that only talks to the docker daemon.
  build-tailscale-head:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true' && needs.changes.outputs.already-green != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Force overlay2 storage driver
        shell: bash
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build tailscale HEAD image
        shell: bash
        run: |
          docker build \
            --file Dockerfile.tailscale-HEAD \
            --tag tailscale-head:${{ github.sha }} \
            .
          docker save tailscale-head:${{ github.sha }} | gzip > tailscale-head-image.tar.gz
      - name: Upload tailscale HEAD image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailscale-head-image
          path: tailscale-head-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  build-postgres:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true' && needs.changes.outputs.already-green != 'true'
    steps:
      - name: Force overlay2 storage driver
        shell: bash
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Pull and save postgres image
        shell: bash
        run: |
          docker pull postgres:latest
          docker tag postgres:latest postgres:${{ github.sha }}
          docker save postgres:${{ github.sha }} | gzip > postgres-image.tar.gz
      - name: Upload postgres image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-image
          path: postgres-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  build-tailscale-released:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true' && needs.changes.outputs.already-green != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      - name: Force overlay2 storage driver
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: List Tailscale versions to pre-pull
        id: versions
        run: |
          versions=$(go run ./cmd/hi list-versions --set=must --exclude=head)
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "Pre-pulling: ${versions}"
      - name: Pull Tailscale images
        run: |
          # Releases come from ghcr.io (anonymous, unmetered). The
          # "unstable" floating tag on ghcr.io has been stale since 2022,
          # so it still needs to come from Docker Hub. xargs -P 0 fans
          # out one process per tag and returns non-zero if any pull
          # fails.
          refs=""
          for v in ${{ steps.versions.outputs.versions }}; do
            if [ "${v}" = "unstable" ]; then
              refs="${refs} tailscale/tailscale:${v}"
            else
              refs="${refs} ghcr.io/tailscale/tailscale:${v}"
            fi
          done
          echo "${refs}" | tr ' ' '\n' | grep -v '^$' \
            | xargs -P 0 -I{} docker pull "{}"
          echo "REFS=${refs}" >> "$GITHUB_ENV"
      - name: Save Tailscale images to tarball
        run: |
          # Single docker save with all refs: one consistent snapshot, no
          # parallel-daemon race.
          docker save ${REFS} | gzip > tailscale-released-images.tar.gz
          ls -lh tailscale-released-images.tar.gz
      - name: Upload Tailscale released images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailscale-released-images
          path: tailscale-released-images.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  sqlite:
    needs:
      - changes
      - build
      - build-tailscale-head
      - build-tailscale-released
    if: needs.changes.outputs.files-changed == 'true' && needs.changes.outputs.already-green != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "01"
            tests: "^(TestOIDCExpireNodesBasedOnTokenExpiry)$;^(TestACLAllowUser80Dst|TestACLNamedHostsCanReach|TestEnablingExitRoutes|TestTagsAuthKeyWithoutUserInheritsTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-false-pol-database).*$;^(TestACLDynamicUnknownUserRemoval|TestOIDCAuthenticationWithPKCE|TestOIDCReloginSameUserRoutesPreserved|TestTagsAuthKeyWithTagRequestDifferentTag|TestTagsAuthKeyWithoutTagCLICannotReduceAdminMultiTag)$ ^TestAuthKeyLogoutAndReloginSameUserExpiredKey$/^(with-https-true).*$"
          - name: "02"
            tests: "^TestAuthKeyLogoutAndReloginSameUser$/^(with-https-false).*$;^(TestDERPVerifyEndpoint|TestExpireNode|TestNodeRenameCommand|TestTagsAdminAPICannotSetInvalidFormat)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-true-pol-file).*$;^(TestAPIAuthenticationBypass|TestGrantViaSubnetSteering|TestTS2021WASMClientUnderNode|TestTagsAuthKeyWithTagRequestNonExistentTag|TestUpdateHostnameFromClient)$ ^TestOIDC024UserCreation$/^(migration-no-strip-domains-not-verified-email).*$"
          - name: "03"
            tests: "^TestAuthKeyLogoutAndReloginSameUserExpiredKey$/^(with-https-false).*$;^(TestPingAllByHostname|TestPolicyBrokenConfigCommand|TestTagsAdminAPICannotSetNonExistentTag|TestTagsAuthKeyConvertToUserViaCLIRegister)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-true-pol-file).*$;^(Test2118DeletingOnlineNodePanics|TestHASubnetRouterFailoverBothOfflineCablePull|TestResolveMagicDNS|TestSSHOneUserToOneCheckModeOIDC|TestTaggedNodesCLIOutput|TestTagsAuthKeyWithoutTagCannotRequestTags)$"
          - name: "04"
            tests: "^(TestDERPServerWebsocketScenario)$;^(TestSSHAutogroupSelf|TestSSHCheckModeCheckPeriodCLI|TestServerInfoCommands|TestTagsAuthKeyWithTagCannotAddViaCLI)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-true-pol-file).*$;^(TestACLDynamicUnknownUserAddition|TestHASubnetRouterFailoverBothOffline|TestSSHMultipleUsersAllToAll|TestTagsAuthKeyWithoutTagCLINoOpAfterAdminWithReset|TestTagsAuthKeyWithoutTagRequestNonExistentTag)$ ^TestSSHLocalpart$/^(MemberAndTagged).*$"
          - name: "05"
            tests: "^(TestAuthWebFlowLogoutAndReloginNewUser)$;^(TestDisableNodeExpiry|TestPolicyCommand|TestPolicyUpdateWhileRunningWithCLIInDatabase|TestSlopscale)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-false-pol-file|webauth-user-advertiseduringup-true-pol-file).*$;^(TestAuthCommandValidation|TestOIDCMultipleOpenedLoginUrls|TestSetNodeExpiryInFuture|TestTagsAuthKeyWithTagAdminOverrideReauthPreserves|TestTagsUserLoginOwnedTagAtRegistration)$ ^TestSSHLocalpart$/^(LocalpartPlusRoot).*$"
          - name: "06"
            tests: "^(TestHASubnetRouterFailoverDockerDisconnect)$;^(TestSubnetRouteACL|TestTagsAuthKeyWithTagNoAdvertiseFlag|TestTagsUserLoginNonExistentTagAtRegistration)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-false-pol-database|webauth-group-advertiseduringup-false-pol-database).*$;^(TestOIDCACLPolicyOnJoin|TestSSHOneUserToOneCheckModeCLI|TestTS2021WebSocketGET|TestTagsAuthKeyWithoutTagRequestUnownedTag|TestTagsIssue2978ReproTagReplacement)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-true-pol-database).*$"
          - name: "07"
            tests: "^(TestACLPolicyPropagationOverTime)$;^(TestNodeCommandValidation|TestResolveMagicDNSExtraRecordsPath|TestSubnetRouterMultiNetworkExitNode|TestTagsAuthKeyWithTagRequestUnownedTag)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-false-pol-database|webauth-user-advertiseduringup-false-pol-file).*$;^(TestExitRoutesWithAutogroupInternetACL|TestPreAuthKeyCommandReusableEphemeral|TestTagsAuthKeyWithTagCLICannotModifyAdminTags|TestTagsUserLoginCLINoOpAfterAdminAssignment|TestTagsUserLoginReauthWithEmptyTagsRemovesAllTags|TestTaildrop)$"
          - name: "08"
            tests: "^(TestNodeOnlineStatus)$;^(TestACLAutogroupMember|TestEphemeral|TestEphemeralInAlternateTimezone|TestTagsAuthKeyWithoutTagCannotAddViaCLI|TestUserCommand)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-false-pol-file).*$;^(TestACLGroupAfterUserDeletion|TestOIDCReloginSameNodeNewUser|TestTaggedNodeLogoutReloginSingleUseKeyOnline|TestTagsReauthDifferentKeyRemovesTag|TestTagsUserLoginCLICannotRemoveAdminTags)$ ^TestOIDC024UserCreation$/^(no-migration-verified-email).*$"
          - name: "09"
            tests: "^(TestTailscaleRustAxum)$;^(TestAuthKeyLogoutAndReloginNewUser|TestAuthKeyLogoutAndReloginRoutesPreserved|TestPreAuthKeyDeleteCommand|TestTagsAuthKeyWithoutTagCLINoOpAfterAdminWithEmptyAdvertise|TestTagsAuthKeyWithoutUserRejectsAdvertisedTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-true-pol-file|webauth-group-advertiseduringup-false-pol-file).*$;^(TestACLGroupDeletionExactReproduction|TestACLGroupWithUnknownUser|TestK8sOperator|TestOAuthClientCommand|TestSSHOneUserToAll)$ ^TestSSHLocalpart$/^(AutogroupSelf).*$"
          - name: "10"
            tests: "^(TestEphemeral2006DeletedTooQuickly|TestUserCommandValidation)$;^(TestACLHostsInNetMapTable|TestNodeRouteCommands|TestPreAuthKeyCorrectUserLoggedInCommand|TestSSHCheckModeSessionLossReDelegates|TestSSHNoSSHConfigured|TestTagsReauthDifferentKeyRetagsNode)$;^(TestGrantCapDrive|TestOIDCExpiryAfterRestart|TestTagsAdminAPICannotRemoveAllTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-true-pol-database|webauth-user-advertiseduringup-false-pol-database).*$"
          - name: "11"
            tests: "^(TestACLDenyAllPort80|TestACLNamedHostsCanReachBySubnet|TestApiKeyCommandValidation)$;^(TestACLDevice1CanAccessDevice2|TestAPIAuthenticationBypassCurl|TestOAuthClientCommandValidation|TestSSHCheckModeAutoApprove)$ ^TestAuthKeyLogoutAndReloginSameUser$/^(with-https-true).*$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-true-pol-database).*$;^(TestACLAutogroupSelf|TestNodeCommand|TestPingAllByIP|TestTailscaleNodesJoiningHeadcale)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-true-pol-database).*$"
          - name: "12"
            tests: "^(TestPolicyCheckCommand|TestSSHUserOnlyIsolation|TestUserCreateCommand)$;^(TestNodeBackfillIPsCommand|TestSSHTestsRejectFailingPolicy)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-false-pol-file|webauth-tag-advertiseduringup-false-pol-database).*$ ^TestOIDC024UserCreation$/^(no-migration-not-verified-email).*$;^(TestACLAllowUserDst|TestCLIWithConfigAuthenticationBypass|TestPreAuthKeyCommandWithoutExpiry|TestSubnetRouteACLFiltering|TestTagsReauthEmptyTagsReturnsToUserSurvives)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-true-pol-database).*$"
          - name: "13"
            tests: "^(TestGrantCapRelay|TestNodeTagCommand|TestTagsUserLoginRemoveTagViaCLIReauth)$;^(TestACLTagPropagationPortSpecific|TestAuthWebFlowLogoutAndReloginSameUser|TestTaggedNodeLogoutReloginReusableKeyOnline|TestTagsOIDCReauthAddOwnedTag)$;^(TestACLAllowStarDst|TestACLTagPropagation|TestApiKeyCommand|TestAuthWebFlowAuthenticationPingAll|TestPreAuthKeyCommand|TestSubnetRouterMultiNetwork)$"
          - name: "14"
            tests: "^(TestDERPServerScenario|TestNodeExpireCommand|TestPreAuthKeyCommandValidation|TestSSHCheckModeUnapprovedTimeout)$;^(TestACLAutogroupTagged|TestOIDCFollowUpUrl|TestTagsAdminAPICanSetUnownedTag|TestTagsUserLoginUnownedTagAtRegistration)$;^(TestHASubnetRouterFailover|TestNodeExpireFlagsCommand|TestOIDCAuthenticationPingAll|TestSSHCheckModeNegativeCLI)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-true-pol-file).*$"
          - name: "15"
            tests: "^(TestEnablingRoutes|TestPingAllByIPManyUpDown|TestTagsAuthKeyWithoutTagRegisterNoTags|TestTagsUserLoginAddTagViaCLIReauth)$;^(TestAuthKeyDeleteKey|TestSSHIsBlockedInACL|TestTagsAuthKeyWithTagCannotChangeViaCLI)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-false-pol-file).*$;^(TestHASubnetRouterPingFailover|TestOIDCReloginSameNodeSameUser|TestPingAllByIPPublicDERP|TestRemoteCLIAuthenticationBypass)$ ^TestAutoApproveMultiNetwork$/^(webauth-user-advertiseduringup-true-pol-database).*$"
    uses: ./.github/workflows/integration-test-template.yml
    secrets: inherit
    with:
      shard: ${{ matrix.shard.name }}
      tests: ${{ matrix.shard.tests }}
      database_name: "sqlite"
      # Only the nightly run keeps the full soak window. Everything else,
      # a pull request or a hand-started run, shortens it: that one test is
      # what bounds the matrix's wall clock, at 735 seconds against 253 for
      # the short window, and a dispatch that does not match its own pull
      # request cannot be compared against one.
      soak_duration: ${{ github.event_name == 'schedule' && '' || '4m' }}
  postgres:
    needs:
      - changes
      - build
      - build-tailscale-head
      - build-postgres
      - build-tailscale-released
    if: needs.changes.outputs.files-changed == 'true' && needs.changes.outputs.already-green != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "01"
            tests: "^(TestEphemeral2006DeletedTooQuickly)$;^(TestPingAllByIPManyUpDown)$;^(TestACLAllowUserDst|TestPingAllByIP|TestSubnetRouterMultiNetwork)$"
    uses: ./.github/workflows/integration-test-template.yml
    secrets: inherit
    with:
      shard: ${{ matrix.shard.name }}
      tests: ${{ matrix.shard.tests }}
      postgres_flag: "--postgres=1"
      database_name: "postgres"
      # Only the nightly run keeps the full soak window. Everything else,
      # a pull request or a hand-started run, shortens it: that one test is
      # what bounds the matrix's wall clock, at 735 seconds against 253 for
      # the short window, and a dispatch that does not match its own pull
      # request cannot be compared against one.
      soak_duration: ${{ github.event_name == 'schedule' && '' || '4m' }}
  # Records that this tree passed, so a later commit that leaves every file
  # the matrix reads untouched skips it. Both matrices have to be green:
  # needs alone does that, because a skipped or failed dependency skips this
  # job and no marker is written.
  record-green:
    runs-on: ubuntu-24.04-arm
    needs:
      - changes
      - sqlite
      - postgres
    steps:
      - name: Write the marker
        shell: bash
        run: |
          mkdir -p .integration-green
          date --utc --iso-8601=seconds > .integration-green/passed-at
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .integration-green
          key: integration-green-${{ needs.changes.outputs.fingerprint }}
