name: integration
# To debug locally on a branch, and when needing secrets
# change this to include `push` so the build is ran on
# the main repository.
on:
  pull_request:
  # The soak test's full window only runs here: a pull request shortens it,
  # because that one job is what bounds the matrix's wall clock.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}
jobs:
  # build: Builds binaries and Docker images once, uploads as artifacts for reuse.
  # build-postgres: Pulls postgres image separately to avoid Docker Hub rate limits.
  # build-tailscale-released: Pre-pulls released Tailscale images from ghcr.io
  # so fork PRs (no DOCKERHUB_USERNAME secret) don't hit Docker Hub rate
  # limits at test time.
  # sqlite: Runs all integration tests with SQLite backend.
  # postgres: Runs a subset of tests with PostgreSQL to verify database compatibility.
  # Deciding whether the matrix has anything to do is a checkout and a filter,
  # so it is its own job. The image jobs below need the answer but none of
  # build's artifacts, and hanging them off build made them wait out its five
  # minutes for a value that was ready in twenty seconds.
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      files-changed: ${{ steps.changed-files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            files:
              - '*.nix'
              - 'go.*'
              - '**/*.go'
              - 'integration/**'
              - 'config-example.yaml'
              - '.github/workflows/test-integration.yaml'
              - '.github/workflows/integration-test-template.yml'
              - 'Dockerfile.*'
  build:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      # The matrix waits on this job, so its length is added to every run's
      # wall clock. Compiling from cold was the bulk of it.
      - name: Restore Go cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-integration-${{ runner.os }}-${{ runner.arch }}-
      - name: Build binaries and warm Go cache
        run: |
          # Build all Go binaries in one nix shell to maximize cache reuse.
          # hi runs on a runner that has no nix store, so it must not be the
          # dynamically linked binary the dev shell's C compiler produces by
          # default: its interpreter would be missing and exec fails with 127.
          CGO_ENABLED=0 go build -o hi ./cmd/hi
          # The container runs the binary on Debian; zigcc links it statically against musl.
          CC=zigcc GOOS=linux go build -trimpath -tags netgo,osusergo -ldflags '-linkmode=external -extldflags=-static' -o slopscale ./cmd/slopscale
          # Build integration test binary to warm the cache with all dependencies
          go test -c ./integration -o /dev/null 2>/dev/null || true
      - name: Upload hi binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hi-binary
          path: hi
          retention-days: 10
      - name: Package Go cache
        run: |
          # Package Go module cache and build cache. gzip -1 rather than the
          # default -6: this runs on the critical path before the matrix can
          # start, while the slightly larger artifact is downloaded by the
          # test jobs in parallel.
          tar -I 'gzip -1' -cf go-cache.tar.gz -C ~ go .cache/go-build
      - name: Upload Go cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-cache
          path: go-cache.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
      - name: Force overlay2 storage driver
        run: |
          # Docker 29 runner images default to overlayfs, which breaks
          # docker build via Go SDK libraries and docker save/load
          # tarball formats. overlay2 is the long-standing default.
          # https://github.com/actions/runner-images/issues/13474
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build slopscale image
        run: |
          docker build \
            --file Dockerfile.integration-ci \
            --tag slopscale:${{ github.sha }} \
            .
          docker save slopscale:${{ github.sha }} | gzip > slopscale-image.tar.gz
      - name: Upload slopscale image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slopscale-image
          path: slopscale-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  # Two minutes of docker build that needs nothing from `build`. Its steps run
  # as plain bash rather than through the dev shell, so it skips installing nix
  # for a job that only talks to the docker daemon.
  build-tailscale-head:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Force overlay2 storage driver
        shell: bash
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build tailscale HEAD image
        shell: bash
        run: |
          docker build \
            --file Dockerfile.tailscale-HEAD \
            --tag tailscale-head:${{ github.sha }} \
            .
          docker save tailscale-head:${{ github.sha }} | gzip > tailscale-head-image.tar.gz
      - name: Upload tailscale HEAD image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailscale-head-image
          path: tailscale-head-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  build-postgres:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true'
    steps:
      - name: Force overlay2 storage driver
        shell: bash
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Pull and save postgres image
        shell: bash
        run: |
          docker pull postgres:latest
          docker tag postgres:latest postgres:${{ github.sha }}
          docker save postgres:${{ github.sha }} | gzip > postgres-image.tar.gz
      - name: Upload postgres image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-image
          path: postgres-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  build-tailscale-released:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      - name: Force overlay2 storage driver
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: List Tailscale versions to pre-pull
        id: versions
        run: |
          versions=$(go run ./cmd/hi list-versions --set=must --exclude=head)
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "Pre-pulling: ${versions}"
      - name: Pull Tailscale images
        run: |
          # Releases come from ghcr.io (anonymous, unmetered). The
          # "unstable" floating tag on ghcr.io has been stale since 2022,
          # so it still needs to come from Docker Hub. xargs -P 0 fans
          # out one process per tag and returns non-zero if any pull
          # fails.
          refs=""
          for v in ${{ steps.versions.outputs.versions }}; do
            if [ "${v}" = "unstable" ]; then
              refs="${refs} tailscale/tailscale:${v}"
            else
              refs="${refs} ghcr.io/tailscale/tailscale:${v}"
            fi
          done
          echo "${refs}" | tr ' ' '\n' | grep -v '^$' \
            | xargs -P 0 -I{} docker pull "{}"
          echo "REFS=${refs}" >> "$GITHUB_ENV"
      - name: Save Tailscale images to tarball
        run: |
          # Single docker save with all refs: one consistent snapshot, no
          # parallel-daemon race.
          docker save ${REFS} | gzip > tailscale-released-images.tar.gz
          ls -lh tailscale-released-images.tar.gz
      - name: Upload Tailscale released images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailscale-released-images
          path: tailscale-released-images.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  sqlite:
    needs: [changes, build, build-tailscale-head, build-tailscale-released]
    if: needs.changes.outputs.files-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "01"
            tests: "^(TestNodeOnlineStatus)$;^(TestAPIAuthenticationBypass|TestPingAllByIPManyUpDown|TestSSHOneUserToOneCheckModeCLI|TestTagsUserLoginUnownedTagAtRegistration)$;^(TestDisableNodeExpiry|TestRemoteCLIAuthenticationBypass|TestSSHUserOnlyIsolation)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-false-pol-file).*$"
          - name: "02"
            tests: "^(TestExitRoutesWithAutogroupInternetACL|TestOIDCExpireNodesBasedOnTokenExpiry)$;^(TestPolicyCheckCommand|TestTagsAuthKeyWithTagCLICannotModifyAdminTags|TestTagsReauthDifferentKeyRetagsNode|TestTagsUserLoginNonExistentTagAtRegistration)$;^(TestNodeTagCommand|TestServerInfoCommands)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-true-pol-database).*$ ^TestOIDC024UserCreation$/^(migration-no-strip-domains-not-verified-email).*$"
          - name: "03"
            tests: "^(TestTS2021WASMClientUnderNode|TestUserCreateCommand)$;^(TestPreAuthKeyCommandValidation|TestTS2021WebSocketGET|TestTagsAdminAPICannotSetNonExistentTag)$ ^TestAuthKeyLogoutAndReloginSameUser$/^(with-https-true).*$;^(TestACLDynamicUnknownUserRemoval|TestACLTagPropagation|TestSSHNoSSHConfigured)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-true-pol-file).*$"
          - name: "04"
            tests: "^(TestACLAllowUser80Dst|TestHASubnetRouterFailoverDockerDisconnect)$;^(TestAuthCommandValidation|TestPolicyUpdateWhileRunningWithCLIInDatabase|TestTagsAuthKeyWithoutTagRegisterNoTags)$ ^TestAuthKeyLogoutAndReloginSameUser$/^(with-https-false).*$;^(TestACLDynamicUnknownUserAddition|TestAuthKeyDeleteKey|TestTagsUserLoginRemoveTagViaCLIReauth)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-false-pol-database).*$"
          - name: "05"
            tests: "^(TestACLAutogroupTagged|TestAuthWebFlowLogoutAndReloginNewUser|TestSSHAutogroupSelf)$;^(TestApiKeyCommandValidation|TestAuthWebFlowLogoutAndReloginSameUser|TestResolveMagicDNS)$;^(TestACLAllowUserDst|TestTagsAdminAPICanSetUnownedTag|TestTagsUserLoginReauthWithEmptyTagsRemovesAllTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-false-pol-database).*$"
          - name: "06"
            tests: "^(TestACLPolicyPropagationOverTime|TestEnablingExitRoutes|TestTagsAuthKeyWithoutTagCLINoOpAfterAdminWithEmptyAdvertise)$;^(TestPolicyBrokenConfigCommand|TestSubnetRouteACLFiltering|TestTagsAuthKeyWithoutTagCannotRequestTags)$;^(TestDERPVerifyEndpoint|TestSSHTestsRejectFailingPolicy|TestTagsReauthDifferentKeyRemovesTag)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-false-pol-file).*$"
          - name: "07"
            tests: "^(TestCLIWithConfigAuthenticationBypass|TestDERPServerWebsocketScenario|TestTagsAdminAPICannotSetInvalidFormat)$;^(TestEphemeral2006DeletedTooQuickly|TestTaggedNodeLogoutReloginSingleUseKeyOnline|TestTagsAuthKeyWithTagRequestNonExistentTag)$;^(TestNodeBackfillIPsCommand|TestSSHCheckModeCheckPeriodCLI|TestTagsAuthKeyWithTagNoAdvertiseFlag)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-true-pol-database).*$"
          - name: "08"
            tests: "^(TestOIDCFollowUpUrl|TestSlopscale|TestUserCommand)$;^(TestACLNamedHostsCanReach|TestPingAllByIP|TestSSHIsBlockedInACL|TestTagsAdminAPICannotRemoveAllTags)$;^(TestACLHostsInNetMapTable|TestPingAllByHostname|TestTagsAuthKeyWithoutUserRejectsAdvertisedTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-true-pol-database).*$"
          - name: "09"
            tests: "^(TestAuthKeyLogoutAndReloginRoutesPreserved|TestOIDCReloginSameNodeNewUser|TestPolicyCommand)$;^(TestApiKeyCommand|TestDERPServerScenario|TestTagsReauthEmptyTagsReturnsToUserSurvives)$;^(TestAPIAuthenticationBypassCurl|TestPreAuthKeyCorrectUserLoggedInCommand|TestTagsUserLoginAddTagViaCLIReauth)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-true-pol-file).*$"
          - name: "10"
            tests: "^(TestAuthWebFlowAuthenticationPingAll|TestSSHCheckModeUnapprovedTimeout|TestSubnetRouterMultiNetworkExitNode)$;^(TestACLGroupDeletionExactReproduction|TestNodeCommand|TestTagsOIDCReauthAddOwnedTag)$;^(TestACLGroupWithUnknownUser|TestResolveMagicDNSExtraRecordsPath|TestTagsUserLoginCLICannotRemoveAdminTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-false-pol-file).*$"
          - name: "11"
            tests: "^(TestNodeCommandValidation|TestTagsAuthKeyWithoutUserInheritsTags|TestTailscaleRustAxum)$;^(TestGrantViaSubnetSteering|TestOAuthClientCommandValidation)$ ^TestAutoApproveMultiNetwork$/^(webauth-user-advertiseduringup-true-pol-file).*$;^(TestACLDevice1CanAccessDevice2|TestNodeRouteCommands|TestTagsUserLoginCLINoOpAfterAdminAssignment)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-false-pol-database).*$"
          - name: "12"
            tests: "^(TestExpireNode|TestHASubnetRouterPingFailover|TestSetNodeExpiryInFuture)$;^(TestPreAuthKeyDeleteCommand|TestSSHOneUserToOneCheckModeOIDC)$ ^TestAutoApproveMultiNetwork$/^(webauth-user-advertiseduringup-true-pol-database).*$;^(TestPreAuthKeyCommandReusableEphemeral|TestPreAuthKeyCommandWithoutExpiry|TestTaildrop)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-true-pol-file).*$"
          - name: "13"
            tests: "^(Test2118DeletingOnlineNodePanics|TestOIDCACLPolicyOnJoin|TestTaggedNodeLogoutReloginReusableKeyOnline)$;^(TestHASubnetRouterFailoverBothOfflineCablePull|TestSSHCheckModeAutoApprove|TestUpdateHostnameFromClient)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-true-pol-file).*$;^(TestTagsAuthKeyWithoutTagCLICannotReduceAdminMultiTag|TestTailscaleNodesJoiningHeadcale)$ ^TestOIDC024UserCreation$/^(no-migration-not-verified-email).*$ ^TestSSHLocalpart$/^(AutogroupSelf).*$"
          - name: "14"
            tests: "^(TestACLTagPropagationPortSpecific|TestOIDCMultipleOpenedLoginUrls|TestTagsIssue2978ReproTagReplacement)$;^(TestSubnetRouterMultiNetwork|TestTagsUserLoginOwnedTagAtRegistration)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-false-pol-file).*$;^(TestTagsAuthKeyConvertToUserViaCLIRegister|TestTagsAuthKeyWithTagAdminOverrideReauthPreserves|TestTagsAuthKeyWithTagCannotAddViaCLI)$ ^TestSSHLocalpart$/^(MemberAndTagged).*$"
          - name: "15"
            tests: "^(TestACLDenyAllPort80|TestSSHOneUserToAll|TestTagsAuthKeyWithTagRequestDifferentTag)$;^(TestOIDCAuthenticationPingAll|TestSSHCheckModeNegativeCLI)$ ^TestAutoApproveMultiNetwork$/^(webauth-user-advertiseduringup-false-pol-file).*$;^(TestEphemeral|TestNodeExpireFlagsCommand|TestTagsAuthKeyWithoutTagCannotAddViaCLI)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-true-pol-database).*$"
          - name: "16"
            tests: "^(TestEphemeralInAlternateTimezone|TestOIDCAuthenticationWithPKCE|TestSSHMultipleUsersAllToAll)$;^(TestACLAllowStarDst|TestOIDCReloginSameUserRoutesPreserved)$ ^TestAutoApproveMultiNetwork$/^(webauth-user-advertiseduringup-false-pol-database).*$;^(TestACLNamedHostsCanReachBySubnet|TestTagsAuthKeyWithoutTagRequestNonExistentTag)$ ^TestOIDC024UserCreation$/^(no-migration-verified-email).*$ ^TestSSHLocalpart$/^(LocalpartPlusRoot).*$"
          - name: "17"
            tests: "^(TestHASubnetRouterFailoverBothOffline|TestPingAllByIPPublicDERP|TestTaggedNodesCLIOutput)$;^(TestACLAutogroupMember|TestK8sOperator)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-true-pol-database).*$;^(TestACLAutogroupSelf|TestOAuthClientCommand|TestTagsAuthKeyWithoutTagRequestUnownedTag)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-false-pol-database).*$"
          - name: "18"
            tests: "^(TestOIDCReloginSameNodeSameUser|TestPreAuthKeyCommand|TestSSHCheckModeSessionLossReDelegates|TestTagsAuthKeyWithTagRequestUnownedTag)$;^(TestACLGroupAfterUserDeletion|TestOIDCExpiryAfterRestart)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-false-pol-database).*$;^(TestAuthKeyLogoutAndReloginNewUser|TestSubnetRouteACL|TestUserCommandValidation)$ ^TestAuthKeyLogoutAndReloginSameUserExpiredKey$/^(with-https-false).*$"
          - name: "19"
            tests: "^(TestHASubnetRouterFailover|TestNodeExpireCommand|TestNodeRenameCommand|TestTagsAuthKeyWithoutTagCLINoOpAfterAdminWithReset)$;^(TestGrantCapDrive|TestGrantCapRelay)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-true-pol-file).*$;^(TestEnablingRoutes|TestTagsAuthKeyWithTagCannotChangeViaCLI)$ ^TestAuthKeyLogoutAndReloginSameUserExpiredKey$/^(with-https-true).*$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-false-pol-file).*$"
    uses: ./.github/workflows/integration-test-template.yml
    secrets: inherit
    with:
      shard: ${{ matrix.shard.name }}
      tests: ${{ matrix.shard.tests }}
      database_name: "sqlite"
      # A pull request shortens the soak window; the nightly run keeps it.
      soak_duration: ${{ github.event_name == 'pull_request' && '4m' || '' }}
  postgres:
    needs:
      [
        changes,
        build,
        build-tailscale-head,
        build-postgres,
        build-tailscale-released,
      ]
    if: needs.changes.outputs.files-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "01"
            tests: "^(TestSubnetRouterMultiNetwork)$;^(TestEphemeral2006DeletedTooQuickly|TestPingAllByIP)$;^(TestACLAllowUserDst|TestPingAllByIPManyUpDown)$"
    uses: ./.github/workflows/integration-test-template.yml
    secrets: inherit
    with:
      shard: ${{ matrix.shard.name }}
      tests: ${{ matrix.shard.tests }}
      postgres_flag: "--postgres=1"
      database_name: "postgres"
      # A pull request shortens the soak window; the nightly run keeps it.
      soak_duration: ${{ github.event_name == 'pull_request' && '4m' || '' }}
