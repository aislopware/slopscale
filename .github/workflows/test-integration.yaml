name: integration
# To debug locally on a branch, and when needing secrets
# change this to include `push` so the build is ran on
# the main repository.
on:
  pull_request:
  # The soak test's full window only runs here: a pull request shortens it,
  # because that one job is what bounds the matrix's wall clock.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}
jobs:
  # build: Builds binaries and Docker images once, uploads as artifacts for reuse.
  # build-postgres: Pulls postgres image separately to avoid Docker Hub rate limits.
  # build-tailscale-released: Pre-pulls released Tailscale images from ghcr.io
  # so fork PRs (no DOCKERHUB_USERNAME secret) don't hit Docker Hub rate
  # limits at test time.
  # sqlite: Runs all integration tests with SQLite backend.
  # postgres: Runs a subset of tests with PostgreSQL to verify database compatibility.
  # Deciding whether the matrix has anything to do is a checkout and a filter,
  # so it is its own job. The image jobs below need the answer but none of
  # build's artifacts, and hanging them off build made them wait out its five
  # minutes for a value that was ready in twenty seconds.
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      files-changed: ${{ steps.changed-files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            files:
              - '*.nix'
              - 'go.*'
              - '**/*.go'
              - 'integration/**'
              - 'config-example.yaml'
              - '.github/workflows/test-integration.yaml'
              - '.github/workflows/integration-test-template.yml'
              - 'Dockerfile.*'
  build:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      - name: Force overlay2 storage driver
        run: |
          # Docker 29 runner images default to overlayfs, which breaks
          # docker build via Go SDK libraries and docker save/load
          # tarball formats. overlay2 is the long-standing default.
          # https://github.com/actions/runner-images/issues/13474
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      # The matrix waits on this job, so its length is added to every run's
      # wall clock. Compiling from cold was the bulk of it.
      - name: Restore Go cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/int-cache/go-build
            ~/go/pkg/mod
          key: go-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-integration-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-integration-${{ runner.os }}-${{ runner.arch }}-
      - name: Build binaries and warm Go cache
        run: |
          # Build all Go binaries in one nix shell to maximize cache reuse.
          # hi runs on a runner that has no nix store, so it must not be the
          # dynamically linked binary the dev shell's C compiler produces by
          # default: its interpreter would be missing and exec fails with 127.
          CGO_ENABLED=0 go build -o hi ./cmd/hi
          # The container runs the binary on Debian; zigcc links it statically against musl.
          CC=zigcc GOOS=linux go build -trimpath -tags netgo,osusergo -ldflags '-linkmode=external -extldflags=-static' -o slopscale ./cmd/slopscale
          # Warm the build cache for the integration tests, in the same image
          # `hi` runs them in and against the same mount points. Warming it
          # with the dev shell's Go was useless: a build cache key covers the
          # compiler that produced it, and nix's toolchain is not the golang
          # image's, so every shard missed and spent four minutes compiling
          # from cold on the first pattern of each of its streams.
          go_version=$(sed -n 's/^go \([0-9.]*\).*/\1/p' go.mod | head -1)
          # Its own directory rather than the dev shell's: the two toolchains
          # cannot read each other's entries anyway, and putting both in one
          # tarball tripled what every shard downloads.
          mkdir -p "$HOME/int-cache/go-build"
          # As the runner rather than root, so the tar below can still read
          # what it writes. GOPATH is /go in the image, which is where the
          # module cache is mounted; HOME only has to exist and be writable.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" \
            --volume "$HOME/go:/go" \
            --volume "$HOME/int-cache/go-build:/cache/go-build" \
            --env GOCACHE=/cache/go-build \
            --env HOME=/tmp \
            --workdir "$PWD/integration" \
            "golang:${go_version}" \
            go test -c . -o /dev/null
      - name: Upload hi binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hi-binary
          path: hi
          retention-days: 10
      - name: Package Go cache
        run: |
          # Package Go module cache and build cache. gzip -1 rather than the
          # default -6: this runs on the critical path before the matrix can
          # start, while the slightly larger artifact is downloaded by the
          # test jobs in parallel.
          tar -I 'gzip -1' -cf go-cache.tar.gz -C ~ go -C ~/int-cache go-build
      - name: Upload Go cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-cache
          path: go-cache.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
      - name: Build slopscale image
        run: |
          docker build \
            --file Dockerfile.integration-ci \
            --tag slopscale:${{ github.sha }} \
            .
          docker save slopscale:${{ github.sha }} | gzip > slopscale-image.tar.gz
      - name: Upload slopscale image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slopscale-image
          path: slopscale-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  # Two minutes of docker build that needs nothing from `build`. Its steps run
  # as plain bash rather than through the dev shell, so it skips installing nix
  # for a job that only talks to the docker daemon.
  build-tailscale-head:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Force overlay2 storage driver
        shell: bash
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Build tailscale HEAD image
        shell: bash
        run: |
          docker build \
            --file Dockerfile.tailscale-HEAD \
            --tag tailscale-head:${{ github.sha }} \
            .
          docker save tailscale-head:${{ github.sha }} | gzip > tailscale-head-image.tar.gz
      - name: Upload tailscale HEAD image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailscale-head-image
          path: tailscale-head-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  build-postgres:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true'
    steps:
      - name: Force overlay2 storage driver
        shell: bash
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Pull and save postgres image
        shell: bash
        run: |
          docker pull postgres:latest
          docker tag postgres:latest postgres:${{ github.sha }}
          docker save postgres:${{ github.sha }} | gzip > postgres-image.tar.gz
      - name: Upload postgres image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-image
          path: postgres-image.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  build-tailscale-released:
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.files-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      - name: Force overlay2 storage driver
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: List Tailscale versions to pre-pull
        id: versions
        run: |
          versions=$(go run ./cmd/hi list-versions --set=must --exclude=head)
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "Pre-pulling: ${versions}"
      - name: Pull Tailscale images
        run: |
          # Releases come from ghcr.io (anonymous, unmetered). The
          # "unstable" floating tag on ghcr.io has been stale since 2022,
          # so it still needs to come from Docker Hub. xargs -P 0 fans
          # out one process per tag and returns non-zero if any pull
          # fails.
          refs=""
          for v in ${{ steps.versions.outputs.versions }}; do
            if [ "${v}" = "unstable" ]; then
              refs="${refs} tailscale/tailscale:${v}"
            else
              refs="${refs} ghcr.io/tailscale/tailscale:${v}"
            fi
          done
          echo "${refs}" | tr ' ' '\n' | grep -v '^$' \
            | xargs -P 0 -I{} docker pull "{}"
          echo "REFS=${refs}" >> "$GITHUB_ENV"
      - name: Save Tailscale images to tarball
        run: |
          # Single docker save with all refs: one consistent snapshot, no
          # parallel-daemon race.
          docker save ${REFS} | gzip > tailscale-released-images.tar.gz
          ls -lh tailscale-released-images.tar.gz
      - name: Upload Tailscale released images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tailscale-released-images
          path: tailscale-released-images.tar.gz
          # Already gzipped; the default level 6 re-compresses it for nothing.
          compression-level: 0
          retention-days: 10
  sqlite:
    needs:
      - changes
      - build
      - build-tailscale-head
      - build-tailscale-released
    if: needs.changes.outputs.files-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "01"
            tests: "^(TestOIDCExpireNodesBasedOnTokenExpiry)$;^(TestTagsAuthKeyWithoutTagRegisterNoTags|TestUpdateHostnameFromClient)$ ^TestSSHLocalpart$/^(LocalpartPlusRoot).*$;^(TestACLAllowStarDst|TestGrantCapDrive|TestTaggedNodeLogoutReloginSingleUseKeyOnline|TestTagsAuthKeyWithoutTagCLICannotReduceAdminMultiTag)$"
          - name: "02"
            tests: "^(TestAuthWebFlowLogoutAndReloginNewUser)$;^(TestACLDynamicUnknownUserAddition|TestApiKeyCommandValidation|TestSetNodeExpiryInFuture)$ ^TestOIDC024UserCreation$/^(no-migration-not-verified-email).*$;^(TestACLTagPropagationPortSpecific|TestPreAuthKeyCommandValidation|TestTagsOIDCReauthAddOwnedTag|TestUserCreateCommand)$"
          - name: "03"
            tests: "^(TestDERPServerWebsocketScenario)$;^(TestACLAllowUser80Dst|TestACLNamedHostsCanReach|TestTaggedNodeLogoutReloginReusableKeyOnline)$;^(TestHASubnetRouterFailoverBothOffline|TestNodeRenameCommand|TestTagsAuthKeyConvertToUserViaCLIRegister|TestTagsAuthKeyWithoutTagCannotAddViaCLI)$"
          - name: "04"
            tests: "^(TestACLPolicyPropagationOverTime)$;^(TestPingAllByIPPublicDERP|TestTagsAdminAPICanSetUnownedTag)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-true-pol-database).*$;^(TestSSHCheckModeUnapprovedTimeout|TestSSHOneUserToOneCheckModeOIDC|TestSubnetRouteACL|TestTailscaleNodesJoiningHeadcale)$"
          - name: "05"
            tests: "^(TestHASubnetRouterFailoverDockerDisconnect)$;^(TestApiKeyCommand|TestEnablingRoutes|TestTagsUserLoginAddTagViaCLIReauth)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-true-pol-database).*$;^(TestNodeRouteCommands|TestSlopscale|TestTS2021WASMClientUnderNode|TestTagsAdminAPICannotRemoveAllTags)$ ^TestOIDC024UserCreation$/^(no-migration-verified-email).*$"
          - name: "06"
            tests: "^(TestNodeOnlineStatus)$;^(TestOIDCMultipleOpenedLoginUrls|TestRemoteCLIAuthenticationBypass|TestTagsAuthKeyWithTagNoAdvertiseFlag)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-false-pol-file).*$;^(TestACLDynamicUnknownUserRemoval|TestPreAuthKeyCommand|TestSSHOneUserToOneCheckModeCLI|TestTagsUserLoginRemoveTagViaCLIReauth)$ ^TestAutoApproveMultiNetwork$/^(webauth-user-advertiseduringup-false-pol-file).*$"
          - name: "07"
            tests: "^(TestTailscaleRustAxum)$;^(TestSSHAutogroupSelf|TestTagsAuthKeyWithoutTagCLINoOpAfterAdminWithReset)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-true-pol-database).*$ ^TestSSHLocalpart$/^(MemberAndTagged).*$;^(TestTagsAdminAPICannotSetNonExistentTag|TestTagsAuthKeyWithoutUserRejectsAdvertisedTags|TestTagsReauthEmptyTagsReturnsToUserSurvives|TestTagsUserLoginNonExistentTagAtRegistration)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-false-pol-file).*$"
          - name: "08"
            tests: "^TestAuthKeyLogoutAndReloginSameUser$/^(with-https-false).*$;^(TestDERPVerifyEndpoint|TestPingAllByHostname|TestTagsAuthKeyWithoutUserInheritsTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-false-pol-database).*$;^(TestAuthKeyLogoutAndReloginRoutesPreserved|TestHASubnetRouterFailoverBothOfflineCablePull|TestTagsAuthKeyWithTagRequestDifferentTag|TestTagsAuthKeyWithTagRequestUnownedTag|TestTagsUserLoginCLICannotRemoveAdminTags)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-false-pol-database).*$"
          - name: "09"
            tests: "^TestAuthKeyLogoutAndReloginSameUser$/^(with-https-true).*$;^(TestAuthKeyDeleteKey|TestOIDCExpiryAfterRestart|TestPolicyUpdateWhileRunningWithCLIInDatabase)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-false-pol-file).*$;^(TestAuthKeyLogoutAndReloginNewUser|TestDisableNodeExpiry|TestResolveMagicDNS|TestTS2021WebSocketGET)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-false-pol-file).*$"
          - name: "10"
            tests: "^(TestACLDenyAllPort80)$;^(TestEnablingExitRoutes|TestTagsAdminAPICannotSetInvalidFormat|TestTagsIssue2978ReproTagReplacement|TestTagsUserLoginOwnedTagAtRegistration|TestTaildrop)$;^(TestExitRoutesWithAutogroupInternetACL|TestSubnetRouteACLFiltering)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-false-pol-database|webauth-user-advertiseduringup-false-pol-database).*$"
          - name: "11"
            tests: "^TestAuthKeyLogoutAndReloginSameUserExpiredKey$/^(with-https-false).*$;^(TestACLGroupDeletionExactReproduction|TestEphemeral|TestNodeExpireFlagsCommand|TestOIDCReloginSameNodeNewUser|TestPreAuthKeyCorrectUserLoggedInCommand)$;^(TestOIDCAuthenticationPingAll|TestSSHOneUserToAll|TestTagsAuthKeyWithTagAdminOverrideReauthPreserves|TestTagsAuthKeyWithoutTagCannotRequestTags)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-false-pol-database).*$"
          - name: "12"
            tests: "^TestAuthKeyLogoutAndReloginSameUserExpiredKey$/^(with-https-true).*$;^(TestACLAllowUserDst|TestHASubnetRouterFailover|TestSSHCheckModeAutoApprove|TestTagsAuthKeyWithoutTagRequestNonExistentTag|TestTagsUserLoginCLINoOpAfterAdminAssignment)$;^(TestACLAutogroupMember|TestNodeCommandValidation|TestPreAuthKeyCommandWithoutExpiry)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-true-pol-file|webauth-user-advertiseduringup-true-pol-file).*$"
          - name: "13"
            tests: "^(TestEphemeral2006DeletedTooQuickly)$;^(TestAuthWebFlowAuthenticationPingAll|TestNodeCommand|TestPingAllByIP|TestPreAuthKeyDeleteCommand|TestSSHCheckModeSessionLossReDelegates)$;^(TestAuthCommandValidation|TestPolicyBrokenConfigCommand|TestSubnetRouterMultiNetwork)$ ^TestAutoApproveMultiNetwork$/^(authkey-group-advertiseduringup-true-pol-file|webauth-tag-advertiseduringup-true-pol-file).*$"
          - name: "14"
            tests: "^(TestGrantCapRelay)$;^(TestACLGroupAfterUserDeletion|TestACLTagPropagation|TestEphemeralInAlternateTimezone|TestNodeBackfillIPsCommand|TestTagsAuthKeyWithoutTagCLINoOpAfterAdminWithEmptyAdvertise)$;^(TestOIDCACLPolicyOnJoin|TestOIDCAuthenticationWithPKCE|TestPolicyCommand|TestServerInfoCommands)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-true-pol-file).*$"
          - name: "15"
            tests: "^(TestDERPServerScenario)$;^(TestACLAutogroupTagged|TestACLNamedHostsCanReachBySubnet|TestSSHCheckModeCheckPeriodCLI|TestTagsAuthKeyWithTagCLICannotModifyAdminTags|TestTagsAuthKeyWithoutTagRequestUnownedTag)$;^(TestGrantViaSubnetSteering|TestNodeTagCommand|TestOIDCReloginSameNodeSameUser|TestPreAuthKeyCommandReusableEphemeral)$ ^TestAutoApproveMultiNetwork$/^(authkey-user-advertiseduringup-true-pol-database).*$"
          - name: "16"
            tests: "^(TestPolicyCheckCommand)$;^(TestAPIAuthenticationBypass|TestHASubnetRouterPingFailover|TestPingAllByIPManyUpDown|TestSSHTestsRejectFailingPolicy|TestUserCommandValidation)$;^(Test2118DeletingOnlineNodePanics|TestSSHNoSSHConfigured|TestTagsAuthKeyWithTagCannotAddViaCLI)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-false-pol-file).*$ ^TestOIDC024UserCreation$/^(migration-no-strip-domains-not-verified-email).*$"
          - name: "17"
            tests: "^(TestSSHIsBlockedInACL|TestTagsAuthKeyWithTagCannotChangeViaCLI)$;^(TestACLHostsInNetMapTable|TestAPIAuthenticationBypassCurl|TestSSHCheckModeNegativeCLI|TestTagsUserLoginReauthWithEmptyTagsRemovesAllTags)$;^(TestOAuthClientCommand|TestSubnetRouterMultiNetworkExitNode|TestTagsUserLoginUnownedTagAtRegistration)$ ^TestAutoApproveMultiNetwork$/^(authkey-tag-advertiseduringup-true-pol-database|webauth-user-advertiseduringup-true-pol-database).*$"
          - name: "18"
            tests: "^(TestCLIWithConfigAuthenticationBypass|TestOIDCFollowUpUrl|TestTagsReauthDifferentKeyRemovesTag)$;^(TestACLDevice1CanAccessDevice2|TestResolveMagicDNSExtraRecordsPath|TestSSHUserOnlyIsolation)$;^(TestNodeExpireCommand|TestOIDCReloginSameUserRoutesPreserved|TestSSHMultipleUsersAllToAll|TestTagsAuthKeyWithTagRequestNonExistentTag)$ ^TestAutoApproveMultiNetwork$/^(webauth-group-advertiseduringup-true-pol-file).*$"
          - name: "19"
            tests: "^(TestK8sOperator|TestOAuthClientCommandValidation|TestTaggedNodesCLIOutput)$;^(TestAuthWebFlowLogoutAndReloginSameUser|TestExpireNode|TestTagsReauthDifferentKeyRetagsNode)$;^(TestACLAutogroupSelf|TestACLGroupWithUnknownUser|TestUserCommand)$ ^TestAutoApproveMultiNetwork$/^(webauth-tag-advertiseduringup-false-pol-database).*$ ^TestSSHLocalpart$/^(AutogroupSelf).*$"
    uses: ./.github/workflows/integration-test-template.yml
    secrets: inherit
    with:
      shard: ${{ matrix.shard.name }}
      tests: ${{ matrix.shard.tests }}
      database_name: "sqlite"
      # A pull request shortens the soak window; the nightly run keeps it.
      soak_duration: ${{ github.event_name == 'pull_request' && '4m' || '' }}
  postgres:
    needs:
      - changes
      - build
      - build-tailscale-head
      - build-postgres
      - build-tailscale-released
    if: needs.changes.outputs.files-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: "01"
            tests: "^(TestEphemeral2006DeletedTooQuickly)$;^(TestPingAllByIPManyUpDown|TestSubnetRouterMultiNetwork)$;^(TestACLAllowUserDst|TestPingAllByIP)$"
    uses: ./.github/workflows/integration-test-template.yml
    secrets: inherit
    with:
      shard: ${{ matrix.shard.name }}
      tests: ${{ matrix.shard.tests }}
      postgres_flag: "--postgres=1"
      database_name: "postgres"
      # A pull request shortens the soak window; the nightly run keeps it.
      soak_duration: ${{ github.event_name == 'pull_request' && '4m' || '' }}
