name: govulncheck

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - ".github/workflows/govulncheck.yml"
  schedule:
    # Daily: the vulnerability database changes without the tree changing.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-$${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      - uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
      - name: govulncheck
        run: go tool govulncheck ./...
      - name: go mod tidy -diff
        run: go mod tidy -diff && go mod verify
