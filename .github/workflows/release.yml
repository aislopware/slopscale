name: Release

# Releases are cut from Conventional Commits by release-please:
#
#   1. Every push to main runs release-please. It reads the commits since the
#      last tag, works out the next version (feat → minor, fix → patch, a
#      `!` or BREAKING CHANGE footer → minor while the major is 0), and opens
#      or refreshes a "chore: release vX.Y.Z" pull request that prepends the
#      version's section to CHANGELOG.md and bumps .release-please-manifest.json.
#      Commits typed docs, chore, ci, test, refactor, style and build do not
#      release on their own and do not show in the notes.
#   2. Merging that pull request is the release: release-please tags the merge
#      commit and creates the GitHub release with the section as its body, and
#      the goreleaser job below builds the binaries, the .deb packages, the
#      source archive and the container images onto it.
#   3. A wrong line in the notes is fixed by editing the body of the pull
#      request that carried the commit with a BEGIN_COMMIT_OVERRIDE block
#      (release-please reads that instead of the commit message); a specific
#      version is forced with a `Release-As: X.Y.Z` footer on any commit.
#
# Run the workflow by hand with a tag to build a release for an existing tag,
# for example after a failed goreleaser run; the notes come from the tag's
# release when it exists, else from its CHANGELOG section.
#
# The Release PR is opened with the workflow's own token, and events raised
# by that token start no workflows, so the PR runs no CI (it changes only
# CHANGELOG.md and the manifest, which ci.yml ignores anyway). Set a
# RELEASE_PLEASE_TOKEN secret (a fine-grained PAT with contents and pull
# requests write) to open it as a user instead and have CI run on it.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the release for (v0.30.0)."
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

jobs:
  release-please:
    if: github.repository == 'aislopware/slopscale' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    # The tag a merged Release PR made, or the one the dispatch named. The
    # release-please job is skipped on a dispatch, which would skip this one
    # too without the !cancelled().
    if: >-
      !cancelled() && github.repository == 'aislopware/slopscale' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # goreleaser and git describe need the whole history and every tag.
          fetch-depth: 0

      # goreleaser gets its notes as a file: the body release-please wrote on
      # the release, or, for a tag with no release yet, the tag's CHANGELOG
      # section with its heading dropped and every other heading moved up a
      # level so they do not render as children of goreleaser's footer.
      - name: Release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG does not exist"
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --json body --jq .body > "$notes" 2>/dev/null || true
          if ! grep -q '[^[:space:]]' "$notes"; then
            base="${TAG#v}"
            base="${base%%-*}"
            awk -v base="$base" '
              /^## / { if (found) exit; v = $2; gsub(/^\[|\].*$/, "", v); if (v == base) { found = 1; next } }
              found { sub(/^###/, "##"); print }
            ' CHANGELOG.md > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::no release body and no CHANGELOG.md section for $TAG"
            exit 1
          fi
          echo "Release notes:"
          cat "$notes"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup
        id: setup
        with:
          go-key: release
          bun: "true"

      # The release cache is keyed on go.sum and the toolchain, so the first
      # release after a dependency or Go update starts cold and compiles the
      # tree three times over (6m39s of the 0.32.0 run, against about a
      # minute warm). The Go workflow's cross jobs built the same three
      # targets with the same flags for the commit being released, one
      # cache each; laid over the release cache they make that first
      # release as warm as the next. Restore only: the release job saves
      # the union under its own key at the end.
      - name: Go cache from the cross build (amd64)
        if: steps.setup.outputs.go-cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-linux-amd64-${{ hashFiles('go.sum', 'flake.lock', 'sqlite.cflags') }}
          restore-keys: |
            go-cross-linux-amd64-
      - name: Go cache from the cross build (arm64)
        if: steps.setup.outputs.go-cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-linux-arm64-${{ hashFiles('go.sum', 'flake.lock', 'sqlite.cflags') }}
          restore-keys: |
            go-cross-linux-arm64-
      - name: Go cache from the cross build (armv7)
        if: steps.setup.outputs.go-cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-linux-arm7-${{ hashFiles('go.sum', 'flake.lock', 'sqlite.cflags') }}
          restore-keys: |
            go-cross-linux-arm7-

      # release.mode is replace: the body release-please wrote comes back in
      # through the notes file with goreleaser's upgrade footer under it.
      - name: goreleaser
        run: goreleaser release --clean --release-notes "$RUNNER_TEMP/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release URL
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" --json url --jq .url
