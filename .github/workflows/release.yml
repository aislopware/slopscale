name: Release

# Cutting a release, by hand from the Actions tab:
#
#   1. CHANGELOG.md has the version's section, `## X.Y.Z (202x-xx-xx)`,
#      written for operators. The workflow refuses to run without it.
#   2. Run this workflow with the version (0.30.0, or 0.30.0-beta.1 for a
#      prerelease) on the branch to release from, normally main.
#   3. For a final release the workflow stamps today's date into the
#      CHANGELOG heading, commits, and tags. A prerelease tags the branch
#      head as it is and takes the unreleased section as its notes.
#   4. goreleaser builds the binaries, the .deb packages, the source archive
#      and the container images, and creates the GitHub release with the
#      CHANGELOG section as its body. With "publish" off the release stays a
#      draft for a last read; on, it is published at once.
#
# Pushing a tag by hand still works and runs only the goreleaser part.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (0.30.0, or 0.30.0-beta.1 for a prerelease)."
        required: true
        type: string
      publish:
        description: "Publish the GitHub release at once instead of leaving a draft."
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

jobs:
  release:
    if: github.repository == 'aislopware/slopscale'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser and git describe need the whole history and every tag.
          fetch-depth: 0

      - name: Resolve the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::'$INPUT_VERSION' is not a version like 0.30.0 or 0.30.0-beta.1"
              exit 1
            fi
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag already exists"
              exit 1
            fi
          else
            tag="$REF_NAME"
            version="${tag#v}"
          fi
          base="${version%%-*}"
          prerelease=false
          if [ "$base" != "$version" ]; then
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "base=$base"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease: $prerelease)"

      # The release body is the version's CHANGELOG section, heading dropped;
      # a prerelease takes the unreleased section of the version it leads to.
      - name: Release notes from CHANGELOG.md
        shell: bash
        env:
          BASE: ${{ steps.version.outputs.base }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          # Every heading moves up one level on the way out. In CHANGELOG.md
          # the sections sit under the version's own "##" heading, which this
          # drops; left at "###" in a release body they render as children of
          # goreleaser's footer, the only other heading on the page.
          awk -v base="$BASE" '
            /^## / { if (found) exit; if ($2 == base) { found = 1; next } }
            found { sub(/^###/, "##"); print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::CHANGELOG.md has no '## $BASE (...)' section; write one for the operators first"
            exit 1
          fi
          echo "Release notes:"
          cat "$notes"

      - name: Stamp the CHANGELOG, commit and tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BASE: ${{ steps.version.outputs.base }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$PRERELEASE" = false ]; then
            sed -i -E "s/^## $BASE \([^)]*\)/## $BASE ($(date -u +%F))/" CHANGELOG.md
            if ! git diff --quiet -- CHANGELOG.md; then
              git commit -m "chore: release $TAG" -- CHANGELOG.md
            fi
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "HEAD:refs/heads/$REF_NAME" "refs/tags/$TAG"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup
        id: setup
        with:
          go-key: release
          bun: "true"

      # The release cache is keyed on go.sum and the toolchain, so the first
      # release after a dependency or Go update starts cold and compiles the
      # tree three times over (6m39s of the 0.32.0 run, against about a
      # minute warm). The Go workflow's cross jobs built the same three
      # targets with the same flags for the commit being released, one
      # cache each; laid over the release cache they make that first
      # release as warm as the next. Restore only: the release job saves
      # the union under its own key at the end.
      - name: Go cache from the cross build (amd64)
        if: steps.setup.outputs.go-cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-linux-amd64-${{ hashFiles('go.sum', 'flake.lock', 'sqlite.cflags') }}
          restore-keys: |
            go-cross-linux-amd64-
      - name: Go cache from the cross build (arm64)
        if: steps.setup.outputs.go-cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-linux-arm64-${{ hashFiles('go.sum', 'flake.lock', 'sqlite.cflags') }}
          restore-keys: |
            go-cross-linux-arm64-
      - name: Go cache from the cross build (armv7)
        if: steps.setup.outputs.go-cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-linux-arm7-${{ hashFiles('go.sum', 'flake.lock', 'sqlite.cflags') }}
          restore-keys: |
            go-cross-linux-arm7-

      - name: goreleaser
        run: goreleaser release --clean --release-notes "$RUNNER_TEMP/notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json url --jq .url
