name: Version bump

# Runs tools/bump: one pull request that moves the flake inputs, the pinned
# bun, the Go modules, the console and docs packages, the build images and the
# action pins, each area gated on its own and dropped alone when it breaks.
# Not a pull_request workflow: a default-branch job's cache writes are
# readable by every later pull request job, so the checks run here come back
# as cache hits there.
#
# Manual dispatch until the pull requests have earned trust; a schedule comes
# after.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Apply and report, but run no final gate and touch no remote"
        type: boolean
        default: false
      areas:
        description: "Comma-separated areas to run (default: all)"
        type: string
        default: ""
      gate:
        description: "Final gate level"
        type: choice
        options: [full, quick, none]
        default: full
      force:
        description: "Open a pull request even if an identical one was closed unmerged"
        type: boolean
        default: false

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # The bot's own token, not GITHUB_TOKEN: a pull request opened with
      # GITHUB_TOKEN triggers no pull_request workflows, and GITHUB_TOKEN
      # cannot push a change to a workflow file. It needs contents, pull
      # requests and workflows write on this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_SECRET }}
      - uses: ./.github/actions/setup
        with:
          go-key: bump
          golangci-lint: "true"
          bun: "true"
          playwright: "true"

      - name: Configure the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The console's browser tests need the system libraries once; the tool
      # installs the browsers of whichever Playwright it locks.
      - name: Browser dependencies
        run: |
          cd web && bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      # There is no separate lock-update step: the tool rebuilds the branch
      # from the base itself, so anything done before it would be discarded.
      # The devShell above only supplies the Go that runs the tool; the tool
      # re-enters `nix develop` per command, which is how the steps after the
      # lock update see the toolchain that was just locked.
      - name: Bump
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SECRET }}
          GATE: ${{ inputs.gate || 'full' }}
          AREAS: ${{ inputs.areas }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          FORCE: ${{ inputs.force || false }}
        run: |
          go run ./tools/bump run \
            --gate="$GATE" \
            --areas="$AREAS" \
            --dry-run="$DRY_RUN" \
            --force="$FORCE"
