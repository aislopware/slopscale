name: Build (main)

# The development image: every push to main that changes the binary or the
# console lands on ghcr.io as main-<sha> and development.

on:
  push:
    branches:
      - main
    paths:
      - "*.nix"
      - "flake.lock"
      - "go.*"
      - "**/*.go"
      - "gen/**"
      - "web/**"
      - "hscontrol/assets/**"
      - "hscontrol/db/*.sql"
      - "sqlite.cflags"
      - ".github/workflows/container-main.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

jobs:
  container:
    if: github.repository == 'aislopware/slopscale'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          go-key: container
          bun: "true"

      - name: Set commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Build admin console
        run: make web

      - name: Build and push to GHCR
        env:
          KO_DOCKER_REPO: ghcr.io/aislopware/slopscale
          KO_DEFAULTBASEIMAGE: gcr.io/distroless/base-debian13
        run: |
          ko build \
            --bare \
            --image-annotation=org.opencontainers.image.source=https://github.com/aislopware/slopscale \
            --image-label=org.opencontainers.image.source=https://github.com/aislopware/slopscale \
            --platform=linux/amd64,linux/arm64 \
            --tags=main-${GITHUB_SHA::7},development \
            ./cmd/slopscale
