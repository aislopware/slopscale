name: Integration Test Template

on:
  workflow_call:
    inputs:
      shard:
        description: "Shard number, used to name this job's log artifacts."
        required: true
        type: string
      tests:
        description: >
          The shard's streams, separated by ";". A stream is space separated
          go test -run patterns that run in order; the streams themselves run
          at once. A split test needs a pattern of its own because go test
          applies the part after "/" to everything the part before it
          selected.
        required: true
        type: string
      postgres_flag:
        required: false
        type: string
        default: ""
      database_name:
        required: true
        type: string
      soak_duration:
        description: >
          How long a soak test watches for a steady state to break. Empty
          keeps each test's full window.
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    env:
      # Github does not allow us to access secrets in pull requests,
      # so this env var is used to check if we have the secret or not.
      # If we have the secrets, meaning we are running on push in a fork,
      # there might be secrets available for more debugging.
      # If TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET is set, then the job
      # will join a debug tailscale network, set up SSH and a tmux session.
      # The SSH will be configured to use the SSH key of the Github user
      # that triggered the build.
      HAS_TAILSCALE_SECRET: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Tailscale
        if: ${{ env.HAS_TAILSCALE_SECRET }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh
      - name: Setup SSH server for Actor
        if: ${{ env.HAS_TAILSCALE_SECRET }}
        uses: alexellis/setup-sshd-actor@master
      - name: Download slopscale image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slopscale-image
          path: /tmp/artifacts
      - name: Download tailscale HEAD image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tailscale-head-image
          path: /tmp/artifacts
      - name: Download tailscale released images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tailscale-released-images
          path: /tmp/artifacts
      - name: Download hi binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hi-binary
          path: /tmp/artifacts
      - name: Download Go cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-cache
          path: /tmp/artifacts
      - name: Download postgres image
        if: ${{ inputs.postgres_flag == '--postgres=1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postgres-image
          path: /tmp/artifacts
      - name: Force overlay2 storage driver
        run: |
          sudo mkdir -p /etc/docker
          echo '{"storage-driver":"overlay2"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker version
      - name: Load br_netfilter for in-cluster service routing
        # TestK8sOperator runs k3s in a container; without br_netfilter on the
        # host, bridged pod-to-pod traffic skips kube-proxy's ClusterIP DNAT and
        # in-cluster DNS (kube-dns) is unreachable. The module cannot be loaded
        # from inside the unprivileged-module rancher/k3s image, so load it here.
        # Which shard holds that test moves as the tests are repacked, so every
        # shard loads it; on the rest it is a no-op.
        run: sudo modprobe br_netfilter
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Load Docker images, Go cache, and prepare binary
        run: |
          gunzip -c /tmp/artifacts/slopscale-image.tar.gz | docker load
          gunzip -c /tmp/artifacts/tailscale-head-image.tar.gz | docker load
          gunzip -c /tmp/artifacts/tailscale-released-images.tar.gz | docker load
          if [ -f /tmp/artifacts/postgres-image.tar.gz ]; then
            gunzip -c /tmp/artifacts/postgres-image.tar.gz | docker load
          fi
          chmod +x /tmp/artifacts/hi
          docker images
          # Extract Go cache to host directories for bind mounting
          mkdir -p /tmp/go-cache
          tar -xzf /tmp/artifacts/go-cache.tar.gz -C /tmp/go-cache
          ls -la /tmp/go-cache/ /tmp/go-cache/.cache/
      - name: Run Integration Test
        env:
          SLOPSCALE_INTEGRATION_SLOPSCALE_IMAGE: slopscale:${{ github.sha }}
          SLOPSCALE_INTEGRATION_TAILSCALE_IMAGE: tailscale-head:${{ github.sha }}
          SLOPSCALE_INTEGRATION_POSTGRES_IMAGE: ${{ inputs.postgres_flag == '--postgres=1' && format('postgres:{0}', github.sha) || '' }}
          SLOPSCALE_INTEGRATION_SOAK_DURATION: ${{ inputs.soak_duration }}
          SLOPSCALE_INTEGRATION_GO_CACHE: /tmp/go-cache/go
          SLOPSCALE_INTEGRATION_GO_BUILD_CACHE: /tmp/go-cache/.cache/go-build
          # Mirror the docker/login-action secrets into env so the
          # dockertestutil.Credentials resolver picks them up directly
          # (otherwise it falls back to parsing ~/.docker/config.json,
          # which works but is one step further from the source).
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CI_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CI_TOKEN }}
          PATTERNS: ${{ inputs.tests }}
        # A shard is a set of streams separated by ";". The streams run at
        # once and the patterns inside one run in order. A test is idle
        # almost throughout (a control server averages under 5% of a CPU and
        # 25 MB), so running them one at a time left the runner doing
        # nothing for most of the shard.
        #
        # --failfast=false: a shard holds many unrelated tests, and one
        # failure must not hide the verdict of the rest. Every pattern runs
        # even after an earlier one fails, and the step exits non-zero if any
        # of them did.
        #
        # --clean-before=false: that sweep removes stale containers and
        # networks daemon-wide, which would reach into the streams running
        # beside it. A CI runner is fresh, so there is nothing stale to
        # remove.
        run: |
          # The patterns are regexes holding "*" and "?", and the loops need
          # word splitting, so turn pathname expansion off rather than quote.
          set -f

          pids=()
          logs=()
          stream=0

          # read returns non-zero on an unterminated last field, which -e
          # would take as a reason to stop before running anything.
          IFS=';' read -ra STREAMS <<<"$PATTERNS" || true

          for patterns in "${STREAMS[@]}"; do
            stream=$((stream + 1))
            log="$RUNNER_TEMP/stream-$stream.log"
            logs+=("$log")
            (
              set -f
              rc=0
              for pattern in $patterns; do
                echo "--- $pattern"
                /tmp/artifacts/hi run --stats --failfast=false \
                  --clean-before=false \
                  --ts-memory-limit=300 --hs-memory-limit=1500 \
                  --timeout=90m "$pattern" ${{ inputs.postgres_flag }} || rc=$?
              done
              exit $rc
            ) >"$log" 2>&1 &
            pids+=($!)
          done

          # Wait for every stream before reporting, so one failure does not
          # leave the others half-run.
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=$?
          done

          # The streams wrote to their own files, so replay them one at a
          # time; interleaved output from three scenarios is unreadable.
          for i in "${!logs[@]}"; do
            echo "::group::stream $((i + 1))"
            cat "${logs[$i]}"
            echo "::endgroup::"
          done

          exit $status
      # The containers run as root and so do the files they leave behind,
      # which the upload cannot read: it fails the whole artifact with
      # "EACCES ... _status.json" and takes the map response captures with
      # it, exactly when a failing shard needs them.
      - name: Make the artefacts readable
        if: always()
        run: sudo chmod -R a+rX control_logs || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.database_name }}-shard-${{ inputs.shard }}-logs
          path: "control_logs/*/*.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.database_name }}-shard-${{ inputs.shard }}-artifacts
          path: control_logs/
      - name: Setup a blocking tmux session
        if: ${{ env.HAS_TAILSCALE_SECRET }}
        uses: alexellis/block-with-tmux-action@master
